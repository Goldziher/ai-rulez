[project]
site_name = "AI-Rulez"
site_description = "Directory-based AI governance for Claude, Cursor, Copilot, Windsurf and 19+ tools"
site_url = "https://goldziher.github.io/ai-rulez"
site_author = "Na'aman Hirschfeld"
repo_name = "Goldziher/ai-rulez"
repo_url = "https://github.com/Goldziher/ai-rulez"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2025-2026 Na'aman Hirschfeld"

extra_css = ["css/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Quick Start" = "quick-start.md" },
  { "Configuration" = "configuration.md" },
  { "Guides" = [
    { "Domains & Profiles" = "domains.md" },
    { "Includes" = "includes.md" },
    { "Installed Skills" = "installed-skills.md" },
    { "Monorepo" = "monorepo.md" },
    { "Examples" = "examples.md" },
  ] },
  { "CLI Commands" = "cli.md" },
  { "MCP Server" = "mcp-server.md" },
  { "Schema" = "schema.md" },
  { "Changelog" = "CHANGELOG.md" },
]

[project.theme]
name = "material"
logo = "assets/logo.png"
favicon = "assets/logo.png"
language = "en"
features = [
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "search.suggest",
  "toc.follow",
  "content.action.edit",
  "content.action.view",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.icon]
repo = "github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "amber"

[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "amber"

[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"

# --- Markdown Extensions ---

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
toc_depth = 3

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
use_pygments = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

# --- Plugins ---

[project.plugins.search]

# --- Extra ---

[project.extra]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Goldziher/ai-rulez"
name = "View on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/npm"
link = "https://www.npmjs.com/package/ai-rulez"
name = "View on npm"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/ai-rulez/"
name = "View on PyPI"
