[project]
site_name = "AI-Rulez"
site_description = "Directory-based AI governance for Claude, Cursor, Copilot, Windsurf and 19+ tools"
site_url = "https://goldziher.github.io/ai-rulez"
site_author = "Na'aman Hirschfeld"
repo_name = "Goldziher/ai-rulez"
repo_url = "https://github.com/Goldziher/ai-rulez"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2025-2026 Na'aman Hirschfeld"

nav = [
    { "Home" = "index.md" },
    { "Installation" = "installation.md" },
    { "Quick Start" = "quick-start.md" },
    { "Configuration" = "configuration.md" },
    { "Guides" = [
        { "Domains & Profiles" = "domains.md" },
        { "Includes" = "includes.md" },
        { "Installed Skills" = "installed-skills.md" },
        { "Authoring Plugins" = "plugins.md" },
        { "Poly Hooks" = "poly-hooks.md" },
        { "Monorepo" = "monorepo.md" },
        { "Examples" = "examples.md" },
    ] },
    { "CLI Commands" = "cli.md" },
    { "MCP Server" = "mcp-server.md" },
    { "Schema" = "schema.md" },
    { "Changelog" = "CHANGELOG.md" },
]

[project.theme]
logo = "assets/logo.png"
favicon = "assets/logo.png"

# --- Markdown Extensions ---

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
use_pygments = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

# --- Plugins ---

[project.plugins.search]

# --- Extra ---

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Goldziher/ai-rulez"
name = "View on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/npm"
link = "https://www.npmjs.com/package/ai-rulez"
name = "View on npm"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/ai-rulez/"
name = "View on PyPI"
