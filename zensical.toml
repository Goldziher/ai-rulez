[project]
site_name = "AI-Rulez"
site_description = "The standards-compliant lifecycle tool for agent knowledge and capabilities: author, generate, bundle, validate, govern, publish"
site_url = "https://goldziher.github.io/ai-rulez"
site_author = "Na'aman Hirschfeld"
repo_name = "Goldziher/ai-rulez"
repo_url = "https://github.com/Goldziher/ai-rulez"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2025-2026 Na'aman Hirschfeld"

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Installation" = "installation.md" },
    { "Quick Start" = "quick-start.md" },
    { "Standards" = "standards.md" },
    { "Migrating to v5" = "migration-v5.md" },
  ] },
  { "Author" = [
    { "Configuration" = "configuration.md" },
    { "Rules" = "rules.md" },
    { "Skill Frontmatter" = "skills.md" },
    { "Checks" = "checks.md" },
    { "OKF (Open Knowledge Format)" = "okf.md" },
    { "Domains & Profiles" = "domains.md" },
    { "Roles" = "roles.md" },
    { "Includes" = "includes.md" },
    { "Installed Skills" = "installed-skills.md" },
    { "Local Configuration" = "local-overrides.md" },
    { "Catalog" = "catalog.md" },
    { "Monorepo" = "monorepo.md" },
    { "Examples" = "examples.md" },
  ] },
  { "Generate" = [
    { "Supported Harnesses" = "harnesses.md" },
    { "AGENTS.md and .agents/skills" = "agents-md.md" },
    { "llms.txt" = "llms-txt.md" },
    { "Hooks and Permissions" = "settings.md" },
    { "Permissions" = "permissions.md" },
    { "User-level Configuration" = "user-scope.md" },
    { "Custom Presets" = "profiles.md" },
    { "Baz" = "baz.md" },
    { "Harness Traps" = "harness-traps.md" },
  ] },
  { "Bundle and publish" = [
    { "Authoring Plugins" = "plugins.md" },
    { "Agent Plugins" = "agent-plugins.md" },
    { "Agentic Resource Discovery" = "ard.md" },
    { "Publish" = "publish.md" },
  ] },
  { "Validate" = [
    { "Strict Validation" = "strict-validation.md" },
    { "Verifiers" = "verifiers.md" },
    { "Poly Hooks" = "poly-hooks.md" },
  ] },
  { "Govern" = [
    { "Trust Model" = "trust-model.md" },
    { "Lock File" = "lockfile.md" },
    { "Approvals" = "approvals.md" },
    { "Signing" = "signing.md" },
    { "Organization Policy" = "policy.md" },
    { "SBOM" = "sbom.md" },
    { "Forge Client" = "forge.md" },
  ] },
  { "Operate" = [
    { "MCP Server" = "mcp-server.md" },
    { "Item-Load Telemetry (OTLP)" = "telemetry.md" },
    { "Usage Telemetry" = "usage-telemetry.md" },
    { "Evals" = "evals.md" },
    { "Improve (experimental)" = "improve.md" },
    { "Skill Search" = "search.md" },
    { "Review" = "review.md" },
    { "LLM Access" = "llm.md" },
    { "Performance" = "performance.md" },
  ] },
  { "Reference" = [
    { "Standards Conformance" = "standards.md" },
    { "CLI Commands" = "cli.md" },
    { "Schema" = "schema.md" },
    { "Embedding (Go API)" = "embedding.md" },
