[project]
site_name = "AI-Rulez"
site_description = "Author, generate, validate and govern AI agent rules, skills, plugins and MCP configuration across 52 coding assistants. Review with verified model evidence, evaluate skills, lock and sign dependencies, and publish bundles. CLI, MCP server and Go API."
site_url = "https://goldziher.github.io/ai-rulez"
site_author = "Na'aman Hirschfeld"
repo_name = "Goldziher/ai-rulez"
repo_url = "https://github.com/Goldziher/ai-rulez"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2025-2026 Na'aman Hirschfeld"

