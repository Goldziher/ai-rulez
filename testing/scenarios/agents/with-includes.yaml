metadata:
  name: "Agent Include Test"
  version: "1.0.0"
  description: "Test agent merging with includes"

includes:
  - "base-agents.yaml"

outputs:
  - path: ".claude/agents/"
    type: "agents"

agents:
  # Override base-reviewer
  - name: "base-reviewer"
    description: "Enhanced code reviewer"
    priority: 10
    tools:
      - "read"
      - "write"
      - "analyze"
    system_prompt: "Enhanced reviewer with more capabilities"
  
  # New agent
  - name: "performance-analyzer"
    description: "Analyzes performance issues"
    priority: 8
    tools:
      - "profile"
      - "measure"
    system_prompt: "You analyze and optimize performance."