metadata:
  name: "Directory Output Test"
  version: "2.0.0"
  description: "Test various directory output configurations"

outputs:
  # Rules to a directory with custom naming
  - path: "docs/"
    type: "rules"
    naming_scheme: "project-rules.md"
    template: "default"
  
  # Agents with index-based naming
  - path: "ai/agents/"
    type: "agents"
    naming_scheme: "agent_{index}_{name}.yaml"
  
  # Another agent directory with type prefix
  - path: ".config/ai/"
    type: "agents"
    naming_scheme: "{type}_{name}.md"
  
  # Mixed - regular file
  - file: "README.md"
    template: |
      # {{ .ProjectName }}
      
      {{ .ProjectDescription }}
      
      ## Rules
      {{ range .Rules }}
      - {{ .Name }}
      {{ end }}

rules:
  - name: "Architecture"
    priority: 10
    content: "Follow clean architecture principles"
  
  - name: "Testing"
    priority: 9
    content: "Maintain 80% test coverage"
  
  - name: "Performance"
    priority: 7
    content: "Optimize for performance"

sections:
  - title: "Development Guidelines"
    priority: 10
    content: |
      Follow these guidelines for development:
      - Use consistent naming conventions
      - Write self-documenting code
      - Implement proper error handling

agents:
  - id: "agent-1"
    name: "architect"
    description: "System architecture specialist"
    priority: 10
    tools: ["design", "review"]
    system_prompt: "You are a system architect."
  
  - id: "agent-2"
    name: "optimizer"
    description: "Performance optimization expert"
    priority: 8
    tools: ["profile", "optimize"]
    system_prompt: "You optimize code for performance."