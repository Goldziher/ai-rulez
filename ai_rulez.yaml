metadata:
    description: AI-Rulez is a Go-based CLI tool and configuration management system that centralizes AI assistant configurations across multiple development tools. It provides a unified YAML-based configuration format for managing coding rules, documentation, specialized AI agents, and custom commands, with support for generating tool-specific outputs (CLAUDE.md, cursor rules, etc.), MCP server integration for direct AI tool communication, and automated migration from legacy formats.
rules:
    - content: Always use the oops library for error context. Wrap errors with oops.Wrapf() including operation context. Never ignore errors from LoadConfig, SaveConfig, or MCP operations. Add hints to errors using oops.Hint() for user-facing messages.
      name: Error Handling with oops
      priority: critical
    - content: Run 'task test' before commits. Write table-driven tests in _test.go files. Use testing/fixtures for test data. Mock file operations with testutil helpers. Test both success and error paths for CRUD operations.
      name: Testing with Task
      priority: critical
    - content: Always call DetectAndMigrate() before LoadConfig(). Test migrations with PreviewMigration() first. Backup configs before v1->v2 migration. Validate migrated configs with schema.Validate().
      name: Config Migration Safety
      priority: high
    - content: Use mark3labs/mcp-go for MCP operations. Implement all CRUD handlers in internal/mcp/handlers. Return proper JSON-RPC errors. Test MCP tools with testing/e2e/mcp tests.
      name: MCP Server Integration
      priority: high
    - content: Use internal/templates for builtin templates. Support inline, file, and builtin template types. Validate templates with GenerateAll() preview mode. Test output generation with generator_test.go patterns.
      name: Generator Templates
      priority: medium
    - content: Place commands in cmd/commands/. Use cobra for CLI parsing. Implement CRUD operations in internal/crud with generics. Add command tests with _test.go suffix.
      name: Command Structure
      priority: medium
    - content: Run 'task lint' with golangci-lint before commits. Use 'task fmt' for consistent formatting. Fix all gocritic and staticcheck warnings. Follow standard Go project layout (cmd/, internal/, testing/).
      name: Linting and Formatting
      priority: low
    - content: Always use the oops library for error handling. Wrap errors with context using oops.Wrapf() and add hints with .Hint(). Never return naked errors - always add context about what operation failed and potential fixes.
      name: Error Handling with Oops
      priority: critical
    - content: Use internal/migration package for v1->v2 config upgrades. Call DetectAndMigrate() when loading configs. Always validate configs with schema.Validate() after loading. Handle migration errors gracefully with user-friendly messages.
      name: Config Version Migration
      priority: high
    - content: 'Use Task for all operations: ''task build'', ''task test'', ''task lint'', ''task fmt''. Fix all golangci-lint issues before commits. Use gofmt -w for formatting. Address gocritic warnings about rangeValCopy and if-else chains.'
      name: Task Commands and Linting
      priority: high
    - content: Place CLI commands in cmd/commands/. Use cobra for command definitions. Implement CRUD operations in internal/crud using generics. Support --recursive flag for monorepo operations. Add --debug flag support via AI_RULEZ_DEBUG env var.
      name: CLI Command Structure
      priority: medium
    - content: Use internal/agents for AI-powered init. Implement incremental layer building through phases. Store context in ProjectContext with AIRulezCommand field. Parse shell commands with go-shellquote. Limit concurrent agents via AI_RULEZ_MAX_AGENTS.
      name: Agent Chain Execution
      priority: medium
    - content: Write table-driven tests for all new functions in internal/ packages. Use testing/fixtures and testing/testutil for test data. Run 'task test' for unit tests and 'task test:e2e' for integration tests before committing.
      name: Test Coverage Requirements
      priority: high
    - content: MCP handlers in internal/mcp/handlers must validate all inputs against schema/ai-rules-v2.schema.json. Use mark3labs/mcp-go for server implementation. Include comprehensive error responses with actionable hints.
      name: MCP Server Implementation
      priority: high
    - content: Templates in internal/templates must handle nil configs gracefully. Use text/template with proper escaping. Test template rendering with PreviewAll() before GenerateAll(). Validate outputs match expected structure.
      name: Generator Template Safety
      priority: medium
sections:
    - content: |-
        ## Prerequisites
        - Go 1.21+ (required for core functionality)
        - Task (build automation): `go install github.com/go-task/task/v3/cmd/task@latest`
        - golangci-lint (code quality): `go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest`

        ## Quick Setup
        ```bash
        # Clone and setup
        git clone https://github.com/Goldziher/ai-rulez
        cd ai-rulez
        task setup  # Installs dependencies and configures git hooks

        # Build binary to ./bin/ai-rulez
        task build

        # Verify installation
        ./bin/ai-rulez --version
        ```

        ## Available Task Commands
        - `task build` - Build binary to ./bin/
        - `task test` - Run unit tests
        - `task test:e2e` - Run end-to-end tests
        - `task lint` - Run golangci-lint checks
        - `task fmt` - Format code with gofmt
        - `task ci` - Run all checks before committing
      name: Development Setup
      priority: high
    - content: |-
        ## Test Organization

        ### Unit Tests
        - Located next to implementation files (`*_test.go`)
        - Run with: `task test` or `go test ./...`
        - Key packages with extensive tests:
          - `/internal/config` - Config loading & validation
          - `/internal/generator` - Template rendering
          - `/internal/migration` - v1→v2 migration

        ### E2E Tests
        ```bash
        # Run all E2E suites
        task test:e2e

        # Individual suites
        task test:e2e:cli         # CLI CRUD operations
        task test:e2e:mcp         # MCP server integration
        task test:e2e:integration # Full workflows
        ```

        ### Test Utilities
        - `/testing/fixtures` - Reusable test configs & data
        - `/testing/testutil` - Helper functions for tests

        ### Writing Tests
        ```go
        // Use table-driven tests (see crud_test.go)
        // Mock filesystem with testutil helpers
        // Test error cases explicitly
        // Use t.Run() for sub-tests
        ```

        ### Coverage
        ```bash
        task test:coverage  # Generate coverage report
        go tool cover -html=coverage.out  # View in browser
        ```
      name: Testing Guide
      priority: medium
    - content: |-
        ## Core Architecture
        ai-rulez follows a clean layered architecture:

        ### Data Layer (`internal/config/`)
        - **types.go**: Core data structures (Config, Rule, Agent, etc.)
        - **loader.go**: YAML parsing and configuration loading
        - **merger.go**: Handles extends/includes composition
        - **validation.go**: Schema validation against `schema/ai-rules-v2.schema.json`

        ### Business Logic (`internal/crud/`)
        - **crud.go**: Centralized CRUD operations for all config elements
        - **generics.go**: Generic helpers for common operations
        - All business logic lives here - CLI and MCP are thin presentation layers

        ### Presentation Layers
        - **CLI** (`cmd/commands/`): Cobra commands calling crud functions
        - **MCP Server** (`internal/mcp/`): Model Context Protocol handlers

        ### Key Services
        - **Generator** (`internal/generator/`): Template rendering and file generation
        - **Migration** (`internal/migration/`): v1 to v2 config migration
        - **Agents** (`internal/agents/`): AI-powered config generation with chain execution

        ## Adding New Features
        1. Update schema in `schema/ai-rules-v2.schema.json`
        2. Add types to `internal/config/types.go`
        3. Implement logic in `internal/crud/crud.go`
        4. Add CLI commands in `cmd/commands/crud/`
        5. Add MCP handlers in `internal/mcp/handlers/`
        6. Write tests in `testing/e2e/`
      name: Architecture Overview
      priority: medium
