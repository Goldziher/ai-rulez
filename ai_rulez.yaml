$schema: https://github.com/Goldziher/ai-rulez/schema/ai-rules-v1.schema.json

metadata:
  name: "ai-rulez"
  version: "1.5.0"
  description: "Lightning-fast CLI tool and MCP server for managing AI assistant rules across multiple platforms"

# Example remote includes (commented out for this project):
# includes:
#   - "https://raw.githubusercontent.com/myorg/coding-standards/main/go-rules.yaml"
#   - "https://api.company.com/ai-rules/security.yaml"

outputs:
  - file: "CLAUDE.md"
    template: "default"

rules:
  - name: "Go Best Practices"
    priority: 10
    content: |
      - Use Go 1.24+ features and idioms
      - Follow effective Go guidelines
      - Use meaningful package, variable, and function names
      - Keep functions small and focused
      - Handle errors explicitly, never ignore them
      - Use context.Context for cancellation and timeouts
      - Prefer composition over inheritance
      - Use interfaces for abstraction
      - Write idiomatic Go code

  - name: "Code Quality"
    priority: 9
    content: |
      - Write clean, readable, and maintainable code
      - Follow SOLID principles where applicable
      - Use consistent formatting (go fmt)
      - Run go vet and golangci-lint before committing
      - Keep cognitive complexity low
      - Avoid premature optimization
      - Use descriptive variable and function names
      - Comment public APIs and complex logic

  - name: "Testing Standards"
    priority: 8
    content: |
      - Write unit tests for all new functionality
      - Maintain test coverage above 80%
      - Use table-driven tests where appropriate
      - Test error conditions and edge cases
      - Use testify/assert for readable assertions
      - Run tests with race detection enabled
      - Write integration tests for complex workflows
      - Use benchmarks for performance-critical code

  - name: "CLI Development"
    priority: 7
    content: |
      - Use cobra for CLI command structure
      - Provide helpful error messages and usage examples
      - Support both flags and environment variables
      - Implement proper exit codes
      - Add command completion support
      - Use spinners/progress bars for long operations
      - Validate input parameters early
      - Follow Unix CLI conventions
      - Support CRUD operations for all configuration elements
      - Implement interactive prompts for missing required fields

  - name: "Performance Optimization"
    priority: 6
    content: |
      - Profile before optimizing
      - Use benchmarks to validate improvements
      - Minimize memory allocations in hot paths
      - Use sync.Pool for object reuse when appropriate
      - Consider concurrency for I/O bound operations
      - Cache expensive computations
      - Avoid unnecessary file system operations
      - Use efficient data structures

  - name: "Error Handling"
    priority: 8
    content: |
      - Always handle errors explicitly
      - Provide context in error messages
      - Use fmt.Errorf with %w verb for error wrapping
      - Log errors at appropriate levels
      - Return meaningful error types for different failure modes
      - Don't panic in library code
      - Use errors.Is and errors.As for error checking
      - Include relevant details in error messages

  - name: "Configuration Management"
    priority: 6
    content: |
      - Use viper for configuration handling
      - Support YAML, JSON, and environment variables
      - Validate configuration early
      - Provide sensible defaults
      - Use JSON Schema for validation
      - Support configuration file discovery
      - Handle missing or invalid configuration gracefully

  - name: "File Operations"
    priority: 5
    content: |
      - Use filepath.Join for cross-platform paths
      - Check file permissions before operations
      - Use atomic writes for important files
      - Handle concurrent file access properly
      - Clean up temporary files
      - Respect file modification times
      - Use appropriate file modes (0644, 0755)

  - name: "Documentation"
    priority: 4
    content: |
      - Document all public APIs with Go doc comments
      - Keep README.md up to date
      - Include usage examples in documentation
      - Document command-line flags and options
      - Add inline comments for complex logic
      - Use clear and concise language
      - Include troubleshooting sections

  - name: "Git and Version Control"
    priority: 3
    content: |
      - Use conventional commits format
      - Write clear commit messages
      - Keep commits focused and atomic
      - Use lefthook for pre-commit validation
      - Tag releases following semantic versioning
      - Update CHANGELOG.md for releases
      - Don't commit sensitive information

  - name: "Release Management"
    priority: 3
    content: |
      - Use GoReleaser for automated releases
      - Support multiple package managers (homebrew, npm, pip)
      - Maintain homebrew tap with automated formula updates
      - Test package installations before final release
      - Include checksums and signatures for security
      - Update installation documentation after releases
      - Maintain cross-platform compatibility (Windows, macOS, Linux)
      - Support both binary releases and package manager distributions

  - name: "MCP Development"
    priority: 7
    content: |
      - Follow MCP specification for tool definitions and responses
      - Implement proper JSON-RPC 2.0 protocol handling
      - Provide comprehensive tool descriptions and parameter schemas
      - Handle errors gracefully with proper error codes
      - Support both stdin/stdout and server transport modes
      - Validate all tool inputs and outputs
      - Use structured logging for MCP operations
      - Test MCP tools with real AI assistant integrations

  - name: "Schema and Validation"
    priority: 6
    content: |
      - Use JSON Schema for all configuration validation
      - Provide clear validation error messages with context
      - Support schema evolution and backward compatibility
      - Validate remote includes for security and structure
      - Generate TypeScript definitions from schemas when needed
      - Test schema validation with edge cases and malformed input
      - Keep schemas in sync with Go structs
      - Document schema changes in release notes

sections:
  - title: "Development Environment"
    priority: 50
    content: |
      ## Development Setup
      
      This project uses Go 1.24+ and Task for build automation.
      
      **Prerequisites:**
      - Go 1.24+
      - Task (taskfile.dev)
      - golangci-lint v2
      - lefthook (for git hooks)
      - pnpm (for npm package management)
      
      **Setup:**
      ```bash
      task setup
      ```
      
      **Common Commands:**
      - `task build` - Build the binary
      - `task test` - Run unit tests
      - `task lint` - Run linting
      - `task ci` - Run all CI checks
      - `task dev` - Development workflow
      
  - title: "Architecture Overview"
    priority: 40
    content: |
      ## Project Structure
      
      ```
      ai-rulez/
      ├── cmd/              # CLI entry point and command definitions
      ├── internal/         # Internal packages
      │   ├── config/       # Configuration loading, validation, and CRUD
      │   ├── generator/    # Output generation and template rendering
      │   ├── templates/    # Built-in templates for various AI platforms
      │   └── mcp/          # Model Context Protocol server implementation
      ├── schema/           # JSON Schema definitions for validation
      ├── examples/         # Example configurations and use cases
      ├── e2e/              # End-to-end integration tests
      │   └── suites/       # Test suites for different functionality
      └── testing/          # Test scenarios and mock data
      ```
      
      The tool is designed for high performance with:
      - Incremental file generation (only writes when changed)
      - Concurrent processing for remote includes and generation
      - Efficient memory usage with streaming processing
      - Fast startup times with optimized initialization
      - Comprehensive test coverage (unit, integration, e2e)
      - Multi-platform support (CLI + MCP server)

  - title: "Remote Configuration Support"
    priority: 45
    content: |
      ## Remote Includes Feature
      
      ai-rulez now supports remote configuration includes via HTTP/HTTPS URLs:
      
      ```yaml
      includes:
        - "https://raw.githubusercontent.com/myorg/standards/main/backend.yaml"
        - "https://api.company.com/ai-rules/security.yaml" 
        - "./local-overrides.yaml"  # Mix with local files
      ```
      
      **Security Features:**
      - SSRF protection (blocks private IPs, localhost, metadata services)
      - Content validation and size limits
      - Timeout protection
      
      **Performance:**
      - Multi-level caching (memory, disk, HTTP headers)
      - Efficient concurrent fetching
      - Smart cache invalidation with ETags

  - title: "Cursor Rules Migration Guide"
    priority: 35
    content: |
      ## ✨ Cursor Rules Migration (.cursorrules → .cursor/rules/)
      
      **Important:** Cursor has deprecated the old `.cursorrules` format in favor of the new `.cursor/rules/` directory with `.mdc` files.
      
      ### New Format Usage
      
      Instead of generating a single `.cursorrules` file, use directory outputs:
      
      ```yaml
      outputs:
        - path: ".cursor/rules/"
          type: "rule" 
          naming_scheme: "rules.mdc"
      ```
      
      This generates `.cursor/rules/rules.mdc` with proper MDC (Markdown with Content) format and metadata headers.
      
      ### Benefits of New Format
      
      - **Better organization** with multiple rule files in a directory
      - **Scoped rules** using file patterns (globs)
      - **Version control friendly** with individual files  
      - **Enhanced metadata** support with frontmatter
      - **Subdirectory support** for folder-specific rules
      
      ### Migration Steps
      
      1. **Update your configuration** to use directory format above
      2. **Regenerate files**: `ai-rulez generate`
      3. **Remove old file**: Delete `.cursorrules` from your project  
      4. **Update .gitignore**: Use `.cursor/` instead of `.cursorrules`
      
      The new format is fully backward compatible - your existing rules work the same way.

  - title: "MCP Server Integration"
    priority: 48
    content: |
      ## Model Context Protocol (MCP) Server
      
      ai-rulez includes a built-in MCP server that allows AI assistants to dynamically manage configuration:
      
      ```bash
      # Start MCP server
      ai-rulez mcp
      
      # With custom config
      ai-rulez mcp --config custom-config.yaml
      ```
      
      **Available MCP Tools:**
      - `get_rules`, `get_sections`, `get_agents` - Retrieve configuration elements
      - `add_rule`, `add_section`, `add_agent` - Create new configuration elements  
      - `update_rule`, `update_section`, `update_agent` - Modify existing elements
      - `delete_rule`, `delete_section`, `delete_agent` - Remove elements
      - `add_output`, `update_output`, `delete_output` - Manage output configurations
      - `generate_output` - Generate files from current configuration
      - `validate_config` - Validate configuration syntax and structure
      - `init_project` - Initialize new projects with provider templates
      - `get_version` - Get current ai-rulez version
      
      **Integration Benefits:**
      - Real-time configuration updates without file editing
      - Seamless AI assistant workflow integration
      - Automatic validation and error handling
      - Support for all configuration operations via API

  - title: "Agent System and CRUD Operations"
    priority: 42
    content: |
      ## Agent Management
      
      ai-rulez supports comprehensive agent management with full CRUD operations:
      
      ```bash
      # Add new agent
      ai-rulez add agent code-reviewer --description "Reviews code quality" \
        --priority 8 --tools "Read,Grep,Edit" --system-prompt "You are a code reviewer..."
      
      # Update existing agent
      ai-rulez update agent code-reviewer --priority 9 --tools "Read,Grep,Edit,MultiEdit"
      
      # Delete agent
      ai-rulez delete agent code-reviewer
      ```
      
      **Agent Features:**
      - Specialized system prompts for different use cases
      - Tool restrictions for focused functionality
      - Priority-based ordering and selection
      - Template-based prompt generation
      - Directory-based output organization
      
      **Common Agent Types:**
      - `code-reviewer` - Code quality and best practices
      - `debugger` - Error analysis and troubleshooting  
      - `documenter` - Documentation generation and updates
      - `tester` - Test case generation and validation
      - `refactor` - Code restructuring and optimization

  - title: "Testing and Quality Assurance"
    priority: 38
    content: |
      ## Comprehensive Test Coverage
      
      The project maintains high quality through extensive testing:
      
      **Test Types:**
      ```bash
      task test          # Run unit tests
      task test-e2e      # Run end-to-end tests  
      task test-race     # Run with race detection
      task coverage      # Generate coverage report
      ```
      
      **Test Structure:**
      - **Unit Tests** - Individual function and method testing
      - **Integration Tests** - Component interaction testing
      - **E2E Tests** - Full CLI workflow testing with real scenarios
      - **MCP Tests** - Model Context Protocol functionality testing
      - **JSON Suite Tests** - Configuration validation and generation
      
      **Quality Gates:**
      - Minimum 80% test coverage required
      - All tests must pass before merge
      - Race condition detection enabled
      - Performance benchmarks for critical paths
      - Schema validation for all configurations