version = "5.0"
name = "AI-Rulez"
description = "Standards-compliant lifecycle tool for agent knowledge and capabilities."
gitignore = true

presets = ["claude", "codex", "opencode", "zed"]

builtins = ["go", "security", "git-workflow", "code-quality", "testing", "default-commands"]

default_layers = ["plugins"]

[lint]
# Fixtures are deliberately invalid; raw builtins are validated through their configured copies.
ignore_paths = [
  "bench/judge/corpus/**",
  "internal/**/testdata/**",
  "internal/builtins/**",
  "tests/review/golden/**/fixtures/**",
  "tests/fixtures/**",
]

[mcp]
self_server_command = ["ai-rulez", "mcp"]

[lock]
include_outputs = false
