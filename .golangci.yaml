version: "2"

run:
  timeout: 5m
  tests: true
  concurrency: 4
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocyclo
    - goconst
    - gocritic
    - gosec
    - misspell
    - nakedret
    - bodyclose
    - contextcheck
    - errorlint
    - nilerr
    - copyloopvar
    - whitespace
    - forbidigo
    - depguard

  settings:
    # Ambient authority (issue #229): library code takes its working directory, environment,
    # clock and processes from values it is given (ambient.Host, runner.Runner) so the engine
    # can run inside a service. tests/archlint enforces the same set from the AST with an empty
    # allowlist; this makes the editor and CI lint say it too.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^os\.(Getwd|Chdir|Getenv|LookupEnv|UserHomeDir|Environ|ExpandEnv|UserConfigDir|UserCacheDir|Hostname|Executable)$'
          msg: take an ambient.Env (ambient.Host) or a path from the caller instead of the process environment
        - pattern: '^time\.(Now|Since|Until)$'
          msg: take an ambient.Clock; ambient.Clock(nil).Now() is the wall clock for deadlines that must run on real time
        - pattern: '^exec\.(Command|CommandContext|LookPath)$'
          msg: start processes through a runner.Runner (runner.LookPath asks whether a tool is installed)
    depguard:
      rules:
        public-api-stays-a-library:
          files: ["**/pkg/**/*.go"]
          list-mode: lax
          deny:
            - pkg: github.com/Goldziher/ai-rulez/v5/cmd
              desc: pkg/ is the public API and must not depend on the command line
        engine-does-not-import-the-facade:
          files: ["**/internal/**/*.go"]
          list-mode: lax
          deny:
            - pkg: github.com/Goldziher/ai-rulez/v5/pkg
              desc: internal packages must not import the public facade (pkg/airulez imports them)
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - fmt.Printf
        - fmt.Println

    goconst:
      min-len: 3
      min-occurrences: 3

    gocyclo:
      min-complexity: 15

    gosec:
      excludes:
        - G101

    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    revive:
      confidence: 0.8
      severity: warning
      rules:
        - name: blank-imports
        - name: context-keys-type
        - name: time-naming
        - name: var-declaration
        - name: unexported-return
        - name: errorf
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - whyNoLint
        - paramTypeCombine
        # hugeParam fires on every ContentFile-by-value signature in the
        # generator and CRUD layers (struct is now 80 bytes with the
        # Resources slice header). The codebase's consistent convention
        # is pass-by-value for content models — switching to pointer
        # would ripple through dozens of helpers without behavior change.
        - hugeParam

  exclusions:
    generated: lax

    rules:
      # forbidigo applies to the engine's library packages only: the command line, the
      # packages that are the process boundary (ambient, runner) or CLI-only by design
      # (agents, watch, logger, telemetry), tests and fixtures are exempt.
      - path: '^(cmd/|tests/|internal/(ambient|runner|agents|watch|testutil|logger|telemetry)/)|_test\.go$'
        linters:
          - forbidigo

      - path: _test\.go
        linters:
          - errcheck
          - goconst
          - gosec
          - gocyclo
          - gocritic

      # SA5011 false-positives: tests guard with `if x == nil { t.Fatalf(...) }`,
      # which terminates, but staticcheck does not model t.Fatalf as terminating.
      - path: _test\.go
        text: "SA5011"
        linters:
          - staticcheck

      - path: tests/fixtures/violations/
        linters:
          - errcheck
          - govet
          - staticcheck
          - unused
          - bodyclose
          - gocritic
          - gosec

      - linters:
          - errcheck
        source: "defer .*.Close"

      - linters:
          - errcheck
        source: "cmd.Flags\\(\\).Get"

      - linters:
          - errcheck
        source: "json.MarshalIndent"

      - linters:
          - errcheck
        source: "hashPool.Get"

      - linters:
          - errcheck
        source: "field.Default.\\("

      - linters:
          - errcheck
        source: "defer.*writer.Flush"

      - linters:
          - errcheck
        source: "filepath.Match"

      - linters:
          - errcheck
        source: "bufferPool.Get\\(\\)"

      - linters:
          - errcheck
        source: "cached\\.\\("

      - linters:
          - errcheck
        source: "element\\.\\(\\*config\\."

      - path: internal/templates/
        linters:
          - goconst

      - linters:
          - govet
        text: "fieldalignment:"

      - linters:
          - govet
        text: "unusedwrite:"

      - linters:
          - revive
        text: "var-naming: avoid .*package names"

      # G304 and G703 are the same finding in two forms: a file path that came
      # from configuration reaching a file operation. Every such path here is one
      # ai-rulez computed from the config it was pointed at, which is the whole
      # job. G703 is excluded alongside G304 rather than annotated per call site
      # because its taint analysis attributes the warning to the innermost open,
      # which moves whenever an unrelated caller is added.
      - linters:
          - gosec
        text: "G301|G302|G304|G306|G703"

    paths:
      - vendor
      - build
      - dist
      - node_modules
      - homebrew-tap

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
  new: false
