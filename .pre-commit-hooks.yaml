- id: ai-rulez-validate
  name: Validate AI rulez configuration
  description: Validate ai-rulez configuration and content (globs, links, hooks, security rules) in every nested project
  entry: scripts/pre-commit/run-ai-rulez.sh
  args:
    - validate
    - --recursive
  language: script
  files: '(^|/)\.ai-rulez/'
  pass_filenames: false
  always_run: false
  require_serial: false

- id: ai-rulez-generate
  name: Generate AI assistant configuration files
  description: Generate AI assistant configuration files from ai-rulez configuration
  entry: scripts/pre-commit/run-ai-rulez.sh
  args:
    - generate
  language: script
  files: '(^|/)\.ai-rulez/'
  pass_filenames: false
  always_run: false
  require_serial: false

- id: ai-rulez-recursive
  name: Generate AI assistant files (recursive)
  description: Generate all ai-rulez output files in the repository recursively
  entry: scripts/pre-commit/run-ai-rulez.sh
  args:
    - generate
    - --recursive
  language: script
  files: '(^|/)\.ai-rulez/'
  pass_filenames: false
  always_run: false
  require_serial: false

- id: ai-rulez-plugin-generate
  name: Generate AI assistant plugins (recursive)
  description: Generate configured plugin bundles and marketplaces recursively
  entry: scripts/pre-commit/run-ai-rulez.sh
  args:
    - generate
    - --recursive
    - --plugin
    - --if-configured
  language: script
  files: '(^|/)\.ai-rulez/'
  pass_filenames: false
  always_run: false
  require_serial: false

- id: ai-rulez-plugin-verify
  name: Verify AI assistant plugins (recursive)
  description: Verify configured plugin bundles and marketplaces recursively
  entry: scripts/pre-commit/run-ai-rulez.sh
  args:
    - verify
    - --recursive
    - --plugin
    - --if-configured
  language: script
  files: '(^|/)\.ai-rulez/'
  pass_filenames: false
  always_run: false
  require_serial: false
