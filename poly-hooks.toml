version = 1

[[hooks]]
id = "ai-rulez-validate"
stages = ["pre-commit"]
args = ["validate", "--no-local"]
files = [".ai-rulez/**", "**/.ai-rulez/**"]
workspace = true
pass_filenames = false

[[hooks.paths]]
channel = "system"
check = "command -v ai-rulez"
run = "ai-rulez"

[[hooks]]
id = "ai-rulez-check"
stages = ["pre-commit"]
args = ["generate", "--check", "--no-local"]
files = ["**"]
workspace = true
pass_filenames = false

[[hooks.paths]]
channel = "system"
check = "command -v ai-rulez"
run = "ai-rulez"

[[hooks]]
id = "ai-rulez-generate"
stages = ["pre-commit"]
args = ["generate", "--no-local"]
files = [".ai-rulez/**", "**/.ai-rulez/**"]
workspace = true
pass_filenames = false

[[hooks.paths]]
channel = "system"
check = "command -v ai-rulez"
run = "ai-rulez"

[[hooks]]
id = "ai-rulez-recursive"
stages = ["pre-commit"]
args = ["generate", "--recursive", "--no-local"]
files = [".ai-rulez/**", "**/.ai-rulez/**"]
workspace = true
pass_filenames = false

[[hooks.paths]]
channel = "system"
check = "command -v ai-rulez"
run = "ai-rulez"

[[hooks]]
id = "ai-rulez-plugin-generate"
stages = ["pre-commit"]
args = ["generate", "--recursive", "--plugin", "--if-configured"]
files = [".ai-rulez/**", "**/.ai-rulez/**"]
workspace = true
pass_filenames = false

[[hooks.paths]]
channel = "system"
check = "command -v ai-rulez"
run = "ai-rulez"

[[hooks]]
id = "ai-rulez-plugin-verify"
stages = ["pre-commit"]
args = ["verify", "--recursive", "--plugin", "--if-configured"]
files = [
  ".ai-rulez/**",
  "**/.ai-rulez/**",
  "plugin/**",
  "plugins/**",
  ".claude-plugin/**",
  ".codex-plugin/**",
  ".cursor-plugin/**",
  ".agents/plugins/**",
  ".opencode/plugins/**",
  ".pi/**",
  ".hermes/**",
  ".github/plugin/**",
]
workspace = true
pass_filenames = false

[[hooks.paths]]
channel = "system"
check = "command -v ai-rulez"
run = "ai-rulez"
