$schema: https://github.com/Goldziher/ai-rulez/schema/ai-rules-v2.schema.json
agents:
    - description: Implements and maintains the Go CLI command tree and internal packages.
      id: golang-maintainer
      name: golang-maintainer
      priority: high
      system_prompt: |
        You maintain the ai-rulez Go CLI.
        - Work inside `cmd/` for user-facing commands and `internal/` for shared services.
        - Write idiomatic, concurrency-safe Go with precise error handling (`oops`) and structured logging.
        - Keep tests fast and deterministic, mirroring the existing table-driven style.
        - Document new flags or workflows in the README and docs.
      targets:
        - .claude/agents/*
        - AGENTS.md
    - description: Designs configuration, documentation, and MCP integrations for new capabilities.
      id: governance-architect
      name: governance-architect
      priority: medium
      system_prompt: |
        You steward the overall governance story.
        - Ensure `ai-rulez.yaml` stays the source of truth for agents, commands, outputs, and enforcement.
        - Reflect capability changes across schema, docs, and multi-runtime packages.
        - Surface onboarding steps and guardrails in generated outputs.
      targets:
        - .claude/agents/*
        - AGENTS.md
commands:
    - description: Outline the architecture, tests, and docs required for a new capability.
      name: capability-plan
      system_prompt: |
        Produce a concise plan covering:
        - impacted packages and files
        - test strategy (unit, integration, fixtures)
        - documentation and release tasks
        - migration or configuration considerations
      usage: /capability-plan <summary>
mcp_servers:
    - args:
        - -y
        - ai-rulez@latest
        - mcp
      command: npx
      description: Expose generation and enforcement to MCP-aware tools such as Claude and Gemini.
      name: ai-rulez
      targets:
        - CLAUDE.md
        - GEMINI.md
metadata:
    description: AI-powered development governance CLI and multi-runtime tooling.
    name: AI-Rulez
    version: 2.3.5
presets:
    - popular
    - continue-dev
    - gemini
rules:
    - content: |
        - Treat `ai-rulez.yaml` as the canonical configuration for all AI tooling.
        - Modify this file first, then regenerate assistant outputs with `ai-rulez generate`.
        - Reject manual edits to generated tool files; ensure diffs show regenerated content only.
        - Keep templates and tests aligned so regenerated files remain stable and consistently ordered.
      name: Source-of-Truth Governance
      priority: critical
      targets:
        - CLAUDE.md
        - .cursor/rules/*
        - .windsurf/*
        - .github/copilot-instructions.md
    - content: |
        - Keep Cobra commands under `cmd/commands` and register them in `cmd/commands/root.go`.
        - Move reusable logic into the appropriate package under `internal/` (config, generator, enforcement, MCP, CRUD, etc.).
        - Wrap errors with the `oops` helpers and route user-facing logs through `internal/logger`.
        - Provide table-driven tests beside the command or package you touch.
      name: Go CLI Architecture
      priority: critical
      targets:
        - CLAUDE.md
        - .cursor/rules/*
        - .github/copilot-instructions.md
        - .windsurf/*
    - content: |
        - Keep Go, npm, and PyPI entry points aligned when you add or rename capabilities.
        - Update documentation in `docs/`, `release/`, and `README.md` when CLI surface changes.
        - Synchronize version bumps across `cmd/commands/root.go`, `package.json`, `pyproject.toml`, and release metadata.
        - Maintain schema updates in `schema/` and refresh generator/enforcer fixtures in `tests/` when behavior changes.
      name: Cross Runtime Distribution
      priority: high
      targets:
        - CLAUDE.md
        - .cursor/rules/*
        - GEMINI.md
        - .continue/**/*.yaml
    - content: |
        - Prefer table-driven Go tests with clear Arrange/Act/Assert phases.
        - Cover failure paths around file IO, CLI flags, concurrency, and external integrations.
        - Use fixtures under `tests/` to exercise generator and enforcement workflows instead of brittle snapshots.
        - Run `ai-rulez validate` and `ai-rulez enforce` in CI to keep configuration healthy.
      name: Testing and QA
      priority: high
      targets:
        - CLAUDE.md
        - .cursor/rules/*
        - .github/copilot-instructions.md
    - content: |
        - Mirror new capability guides in `docs/` and regenerate the MkDocs site when behavior changes.
        - Keep configuration examples aligned with the JSON schema defaults and CLI output.
        - Highlight agent and MCP integrations that improve onboarding.
      name: Documentation and Samples
      priority: medium
      targets:
        - CLAUDE.md
        - GEMINI.md
        - .continue/rules/*
sections:
    - content: |
        ## Core Go CLI
        - `cmd/main.go`: boots the CLI and injects the version string.
        - `cmd/commands/`: Cobra command implementations (`generate`, `enforce`, CRUD helpers).
        - `internal/`: service packages for config loading, generator, enforcement, MCP, templates, and utilities.

        ## Multi-runtime Wrappers
        - `release/npm` and `release/pypi`: JavaScript and Python entry points backed by the Go binary.
        - `homebrew-tap`: tap formula for Homebrew distribution.

        ## Documentation & Tooling
        - `docs/`, `site/`, and `mkdocs.yaml`: user-facing documentation and site generation.
        - `tests/` and `testing/`: fixtures, integration scenarios, and validation helpers.
      id: repository-layout
      name: Repository Layout
      priority: high
      targets:
        - CLAUDE.md
        - .cursor/rules/*
    - content: |
        1. Configuration generation loads `ai-rulez.yaml` through `internal/config`, renders templates from `internal/templates`, and writes outputs via `internal/generator`.
        2. Enforcement creates an `enforcement.Enforcer`, analyzes files with the selected agent, and reports results through the reporter pipeline.
        3. CRUD subcommands manipulate YAML using the config loader/saver with detailed diagnostics.
        4. MCP handlers in `internal/mcp` expose generation and enforcement to external tools.
      id: core-workflows
      name: Core Workflows
      priority: high
      targets:
        - CLAUDE.md
        - .cursor/rules/*
        - GEMINI.md
    - content: |
        - Capture an implementation plan and accompanying tests before touching code.
        - Update docs, schema, and multi-runtime wrappers in the same change set.
        - Include enforcement coverage or fixtures that demonstrate the new feature.
        - Run `go test ./...` and regenerate outputs before opening a PR.
      id: capability-delivery-checklist
      name: Capability Delivery Checklist
      priority: medium
      targets:
        - CLAUDE.md
        - .github/copilot-instructions.md
        - .continue/rules/*
