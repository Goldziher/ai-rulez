# Configuration for the lychee link checker.
# https://github.com/lycheeverse/lychee

exclude = [
  # Schema files linked on main before they land there (404 until the PR merges)
  "raw\\.githubusercontent\\.com/Goldziher/ai-rulez/main/schema/change-result\\.schema\\.json",

  # Localhost / loopback addresses
  "localhost",
  "127\\.0\\.0\\.1",
  "0\\.0\\.0\\.0",

  # Placeholder / example domains
  "example\\.com",
  "example\\.org",

  # Template variables
  "\\$\\{",
  "\\{\\{",

  # GitHub edit links (require auth)
  "github\\.com/.*/edit/",

  # GitHub raw links for new/renamed files (404 until pushed)
  "github\\.com/.*/raw/",

  # Docs site self-references and base path links (resolve correctly when deployed)
  "goldziher\\.github\\.io/ai-rulez",
  "file:///.*site/ai-rulez",

  # PyPI project pages (rate-limited)
  "pypi\\.org/project/",

  # npm (rate-limited)
  "npmjs\\.com/package/",

  # Live pages lychee cannot reach from GitHub runners, on every run since
  # 2026-10-06: ampcode.com fails lychee's HTTP/2 handshake (curl gets 200)
  # and codebuddy.ai times out from the runner's network.
  "^https://ampcode\\.com/?$",
  "^https://www\\.codebuddy\\.ai/docs/cli",

  # The rule text "[name](url)" in strict-validation renders as a relative link.
  "^file:///.*/site/url$",

  # 404 until the conformance suite lands on main.
  "^https://github\\.com/Goldziher/ai-rulez/tree/main/tests/conformance$",
]

# llms-full.txt concatenates every docs page as plain text, so its placeholder
# URLs (org/repo, host, example-org, ...) are examples, not links; the rendered
# HTML pages are still checked.
exclude_path = ["site/llms-full.txt"]

# Accept these HTTP status codes as valid. 429 and 503 are throttling responses
# (github.com serves blob pages to the checker with intermittent 503s), not dead links.
accept = [200, 204, 301, 302, 429, 503]

timeout = 30
max_retries = 3
max_concurrency = 10
include_mail = false
require_https = false
cache = true
