# Allowlist for false-positive spellings flagged by poly's bundled typos engine.
# These are deliberate abbreviations, technical terms, or test fixtures.
[default.extend-words]
Strat = "Strat"         # includeMergeStrat (MergeStrategy)
Hashi = "Hashi"         # HashiCorp
hel = "hel"             # test fixture token
invokable = "invokable"
caf = "caf"             # café test data
propert = "propert"     # split/truncated schema token

[files]
# Seeded random texts the area matcher is tested on: misspellings are the point.
extend-exclude = ["internal/areas/testdata/match_vectors.json"]
