# Generated by scripts/migrate_to_poly.py from .pre-commit-config.yaml + tool configs. Review before committing.

[defaults]
line_length = 120
line_ending = "lf"
final_newline = true
trim_trailing_whitespace = true

[discovery]
exclude = [
  "**/*.lock",
  "**/*.svg",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/testdata/*.golden.json",
  "internal/importer/testdata/convert/**",
  "tests/review/golden/**/fixtures/**",
  "tests/review/golden/**/golden/*.golden.yaml",
  "**/testdata/dialects/*.golden.*",
  "**/testdata/*.golden.js",
  "**/testdata/*.golden.ts",
  "**/uv.lock",
  "dist/**",
  "bench/judge/corpus/**",
  "internal/lint/testdata/**",
  "internal/publish/emit/testdata/**",
  "internal/agentplugins/testdata/**",
  "internal/okf/testdata/**",
  "internal/okfbridge/testdata/**",
  "internal/migrate/testdata/**",
  "internal/ard/schema/**",
  "internal/ard/testdata/**",
  "cmd/commands/testdata/ard/**",
  "tests/conformance/schemas/**",
  "internal/sbom/testdata/**",
  "internal/sbom/spdx_licenses.txt",
  "docs/llms-full.txt",
  "docs/snippets",
  "tools/harness-builtins/testdata/**",
  "node_modules/**",
  "release/**",
  "target/**",
  "vendor/**",
]

[lint.markdown.rumdl]
disable = ["MD012", "MD013", "MD024", "MD030", "MD033", "MD035", "MD036", "MD041", "MD046", "MD051", "MD076"]

[fmt.markdown.rumdl]
disable = ["MD012", "MD013", "MD024", "MD030", "MD033", "MD035", "MD036", "MD041", "MD046", "MD051", "MD076"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
lint = { exclude = [
  "**/*.lock",
  "**/*.svg",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  "dist/**",
  "bench/judge/corpus/**",
  "docs/llms-full.txt",
  "docs/snippets",
  "tools/harness-builtins/testdata/**",
  "node_modules/**",
  "release/**",
  "target/**",
  "vendor/**",
] }
fmt = { exclude = [
  "**/*.lock",
  "**/*.svg",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  "dist/**",
  "bench/judge/corpus/**",
  "docs/llms-full.txt",
  "docs/snippets",
  "tools/harness-builtins/testdata/**",
  "node_modules/**",
  "release/**",
  "target/**",
  "vendor/**",
] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = [
  "**/*.lock",
  "**/*.svg",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  "dist/**",
  "bench/judge/corpus/**",
  "docs/llms-full.txt",
  "docs/snippets",
  "tools/harness-builtins/testdata/**",
  "node_modules/**",
  "release/**",
  "target/**",
  "vendor/**",
] }

# --- catalog tools (standalone binaries, PATH-probed) ---
[tools.golangci-lint]
enabled = true
# NOTE: env + per-module cwd (e.g. packages/go) not yet supported by [tools.*].

[tools.shfmt]
enabled = true

[tools.shellcheck]
enabled = true

[tools.actionlint]
enabled = true

# --- dropped / unmapped hooks (for the record) ---
# dropped (toolchain) — stays as standalone CI job: govulncheck

[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
