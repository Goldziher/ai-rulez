version = "5.0"
name = "tokens-test"
description = "Fixture for the tokens command"
presets = ["claude"]
# Builtins are deliberately left off: this fixture backs a golden report, and
# pulling in the builtin domains would make the golden churn whenever a builtin
# rule is edited. TestTokenReport_AgentsRosterIsItsOwnSection enables
# agent-delegation on a copy of this fixture instead.
default = "backend"
gitignore = false

[profiles]
backend = ["backend"]
frontend = ["frontend"]
full = ["backend", "frontend"]
