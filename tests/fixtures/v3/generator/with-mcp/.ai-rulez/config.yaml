version: "3.0"
name: with-mcp-test
description: Test with MCP servers (auto-generation without preset)
presets:
  - claude
gitignore: false
mcp_servers:
  - name: test-server
    command: python
    args:
      - "-m"
      - test_server
    transport: stdio
    enabled: true
    env:
      DEBUG: "true"
