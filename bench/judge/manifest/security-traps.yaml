  - id: twin-t02
    dir: units/twin-t02
    group: twin
    trap: T02
    twin_of: trap-t02
    expect:
      - code: JR-S05
        path: units/twin-t02/.claude/skills/page-shot/scripts/shot.py
        contains: "shell=True"
        min_severity: high
    clean_categories: []
    note: "shell=True with fetched issue text."
