units:
  - id: trap-t01
    dir: units/trap-t01
    group: trap
    trap: T01
    expect: []
    clean_categories: [security]
    note: "Static literal UNION ALL between fixed SELECTs."
  - id: twin-t01
    dir: units/twin-t01
    group: twin
    trap: T01
    twin_of: trap-t01
    expect:
      - code: JR-S08
        path: units/twin-t01/.claude/skills/sales-report/scripts/report.py
        contains: "UNION ALL SELECT region, total FROM {extra}"
        min_severity: medium
    clean_categories: []
    note: "UNION ALL built from fetched ticket text reaches SQL."
  - id: trap-t02
    dir: units/trap-t02
    group: trap
    trap: T02
    expect: []
    clean_categories: [security]
