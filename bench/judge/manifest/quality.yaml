units:
  - id: q01-a
    dir: units/q01-a
    judge_path: units/q01-a
    group: quality
    expect:
      - code: JR-Q01
        path: units/q01-a/.claude/skills/data-helper/SKILL.md
        contains: "name: data-helper"
        min_severity: medium
    clean_categories: [security]
    note: "Skill has no description at all."
