$schema: ../schema/ai-rules-v1.schema.json

metadata:
  name: "Remote Includes Example"
  version: "2.0.0"
  description: "Demonstrates remote configuration includes with caching"

includes:
  - "https://raw.githubusercontent.com/myorg/coding-standards/main/backend-rules.yaml"
  
  - "https://raw.githubusercontent.com/myteam/standards/main/api-rules.yaml"
  
  - "https://api.company.com/ai-rules/v1/security.yaml"
  
  - "./team-overrides.yaml"
  
  - "./ai-rulez.local.yaml"

outputs:
  - file: "CLAUDE.md"
  - path: ".cursor/rules/"
    type: "rule"
    naming_scheme: "{priority:02d}-{name}.mdc"

rules:
  
  - name: "API Security"
    id: "sec-001"  
    priority: 10
    content: |
      - Validate all input parameters
      - Use parameterized queries
      - Implement rate limiting
      - Add authentication middleware
      
  - name: "Performance Standards"
    id: "perf-001"
    priority: 8
    content: |
      - API response time < 200ms
      - Database queries < 50ms
      - Use caching for repeated queries
      - Implement pagination for lists

userRulez:
  - name: "Personal Code Style"
    content: |
      - Use 2 spaces for indentation
      - Prefer const over let
      - Always use semicolons
      
  - name: "API Security"  
    id: "sec-001"
    priority: 10
    content: |
      - ENHANCED: Use OAuth2 with JWT
      - ENHANCED: Implement field-level encryption
      - Validate all input parameters
      - Use parameterized queries
      - Implement rate limiting
      - Add authentication middleware

sections:
  - title: "Remote Configuration Strategy"
    priority: 90
    content: |
      ## Configuration Hierarchy
      
      Rules are loaded and merged in this order:
      1. Base configuration (this file)
      2. Remote includes (in order listed)
      3. Local includes
      4. UserRulez overrides
      
      ## Caching Strategy
      
      Remote configurations are cached:
      - **Memory Cache**: 5 minutes (L1)
      - **Disk Cache**: 24 hours (L2)
      - **HTTP Cache**: Respects ETag/Last-Modified (L3)
      
      ## Security
      
      All remote URLs are validated:
      - SSRF protection enabled
      - Private IP ranges blocked
      - Metadata endpoints blocked