$schema: ../schema/ai-rules-v1.schema.json

metadata:
  name: "Named Targets Example"
  version: "1.0.0"
  description: "Demonstrates how to use named targets to create reusable target groups"

targets:
  claude-files:
    - "CLAUDE.md"
    - ".claude/**/*.md"
  
  documentation:
    - "*.md"
    - "docs/**/*.md"
    - "README.md"
  
  agent-files:
    - "ai/agents/**/*.md"
    - ".claude/agents/*.md"

outputs:
  - file: "CLAUDE.md"
    template: "default"
  - file: "README.md"
    template: "documentation"
  - path: "docs/"
    type: "rule"
    naming_scheme: "guidelines.md"
  - path: "ai/agents/"
    type: "agent"
    naming_scheme: "{name}.md"

sections:
  - title: "Project Overview"
    priority: 100
    content: |
      # Welcome to Our Project
      
      This section appears in all generated files because no targets are specified.

  - title: "Claude-Specific Instructions"
    priority: 90
    targets: ["@claude-files"]  
    content: |
      ## Special Instructions for Claude
      
      These instructions are specifically tailored for Claude AI assistant usage.
      They won't appear in other documentation files.

  - title: "Documentation Header"
    priority: 80
    targets: ["@documentation"]  
    content: |
      ## Documentation Guidelines
      
      This header appears in documentation files but not in Claude-specific outputs.

rules:
  - name: "Universal Code Standards"
    priority: 50
    content: |
      - Use consistent naming conventions
      - Write clear, self-documenting code
      - Follow the project's style guide

  - name: "Claude AI Guidelines"
    priority: 40
    targets: ["@claude-files"]  
    content: |
      - Always ask for clarification when requirements are ambiguous
      - Provide step-by-step explanations for complex tasks
      - Suggest best practices and alternatives when appropriate

  - name: "Documentation Standards"
    priority: 30
    targets: ["@documentation"]  
    content: |
      - Keep documentation up to date with code changes
      - Use clear headings and proper markdown formatting
      - Include examples and code snippets where helpful

  - name: "Agent-Specific Rules"
    priority: 35
    targets: ["@agent-files"]  
    content: |
      - Define clear agent roles and responsibilities
      - Specify required tools and capabilities
      - Include example interactions and use cases

  - name: "Mixed Target Example"
    priority: 25
    targets: ["@claude-files", "src/*.go"]  
    content: |
      - This rule applies to Claude files (via named target)
      - AND to Go source files (via inline pattern)

agents:
  - name: "code-reviewer"
    description: "Reviews code for quality and best practices"
    priority: 20
    targets: ["@claude-files", "@agent-files"]  
    tools: ["file_reader", "git_operations"]
    system_prompt: |
      You are a senior code reviewer with expertise in multiple programming languages.
      Focus on code quality, maintainability, and adherence to best practices.

  - name: "documentation-writer"
    description: "Helps write and maintain project documentation"
    priority: 15
    targets: ["@documentation"]  
    tools: ["file_writer", "web_search"]
    system_prompt: |
      You are a technical writer specializing in developer documentation.
      Create clear, comprehensive documentation that helps developers understand and use the project.

  - name: "general-assistant"
    description: "General-purpose AI assistant for various tasks"
    priority: 10
    tools: ["file_operations", "web_search", "calculator"]
    system_prompt: |
      You are a helpful AI assistant ready to help with a wide variety of tasks.
      Be thorough, accurate, and always ask for clarification when needed.