$schema: https://github.com/Goldziher/ai-rulez/schema/ai-rules-v1.schema.json

metadata:
  name: "Windsurf Preset Example"
  version: "1.0.0"
  description: "Example configuration generated with --preset windsurf"


outputs:
  - path: ".windsurf/"
    type: "rule"
    naming_scheme: "{name}.md"
    description: "Windsurf editor rules using directory format"

rules:
  - name: "Windsurf Development"
    priority: 10
    content: |
      - Follow Windsurf's AI-first development approach
      - Use natural language for complex operations
      - Leverage Windsurf's context understanding
      - Utilize multi-modal capabilities when available
  
  - name: "Code Standards"
    priority: 9
    content: |
      - Maintain consistent code style
      - Write self-documenting code
      - Follow project conventions
      - Keep code modular and reusable
  
  - name: "Collaboration"
    priority: 8
    content: |
      - Write clear commit messages
      - Document significant changes
      - Keep pull requests focused
      - Respond to code review feedback

sections:
  - title: "Windsurf Editor Guidelines"
    priority: 10
    content: |
      ## Working with Windsurf
      
      Windsurf is designed for AI-native development:
      
      ### Key Features
      - Natural language code generation
      - Intelligent code completion
      - Context-aware suggestions
      - Multi-file understanding
      
      ### Best Practices
      1. Describe intent clearly in natural language
      2. Review AI-generated code carefully
      3. Use Windsurf's refactoring tools
      4. Leverage project-wide context