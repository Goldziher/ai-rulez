# Where each harness keeps its built-in names, and the ref the data files were last generated
# from. generate.py reads the registry at that ref (or the live documentation page when there is
# no repo) and rewrites the names of the groups the targets select. Everything else in
# internal/harnessnames/data/<preset>.toml is hand-curated and kept.
#
# [<preset>]            extractor   file in extractors/ (without .py), or "none" with a reason
#                       repo, ref   the GitHub repository and the tag or commit the names are read at
#                       track       "tags" (default) or "head": what --bump proposes
#                       tag_pattern regexp a tag must match to be proposed by --bump
#                       harness_version  copied into the data file
# [[<preset>.target]]   key         the key of the extractor result
#                       kind        group kind
#                       url_contains  text of the url of the group's source (selects the group)
#                       collision   narrows the selection to one user_collision value
#                       add, exclude  names the registry does not show / that are not real names
#                                   (say why in a comment)
# Every data file has exactly one entry.

[aiassistant]
extractor = "none"
reason = "completeness is none: JetBrains AI Assistant is closed source and its help pages describe chat commands in prose with no list of built-in command, skill or agent names, so the data file has no names to regenerate."

[amp]
extractor = "none"
reason = "ampcode.com/docs/markdown/customize/skills names the one built-in skill (building-skills) only in a sentence and models-and-subagents lists the subagents in prose bullets next to mode names, so there is no table or list a parser can read."

[antigravity]
extractor = "antigravity"

[[antigravity.target]]
key = "command"
kind = "command"
url_contains = "docs/cli/reference"

[augment]
extractor = "augment"

[[augment.target]]
key = "command"
kind = "command"
url_contains = "interactive.md"

[baz]
extractor = "none"
reason = "completeness is none: baz is a closed-source code review product with no public registry or documentation page that lists built-in command, skill or agent names, so the data file has no names to regenerate."

[bob]
extractor = "none"
reason = "bob.ibm.com/docs/ide/features/slash-commands is a client-rendered HTML page with no markdown rendition (the .md URL is a 404); the built-in commands are headings, the mode commands (/code, /ask) are named only in prose, and the built-in skills and subagents appear in prose or in an untitled HTML table."

[claude]
extractor = "claude"
harness_version = "2.1.302 (local binary); docs fetched 2026-10-18"

[[claude.target]]
key = "command"
kind = "command"
url_contains = "commands.md"

# bundled skills and the bundled /deep-research workflow are marked Skill / Workflow in the same table
[[claude.target]]
key = "skill"
kind = "skill"
url_contains = "commands.md"

# a subagent the page says a same-named user or project subagent overrides
[[claude.target]]
key = "agent_override"
kind = "agent"
url_contains = "sub-agents.md"
collision = "user_wins"

# the other built-in subagents: the page does not say what a same-named user subagent does
[[claude.target]]
key = "agent"
kind = "agent"
url_contains = "sub-agents.md"
collision = "unknown"
# the tab title is capitalised; the subagent_type the page and the Agent tool use is lower case
exclude = ["General-purpose"]
add = ["general-purpose"]

