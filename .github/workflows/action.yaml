name: Official Action

on:
  push:
    branches: [main, develop]
    paths: &action-paths
      - "action.yml"
      - "check/**"
      - "scripts/action/**"
      - "scripts/pre-commit/run-ai-rulez.sh"
      - "scripts/update-action-tag*"
      - "scripts/test_update_action_tag.py"
      - "tests/bats/scripts/action-*.bats"
      - ".github/workflows/action.yaml"
      - ".github/workflows/publish.yaml"
  pull_request:
    branches: [main]
    paths: *action-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: Setup on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      AI_RULEZ_LLM_PROVIDER: openai
      AI_RULEZ_LLM_MODEL: inherited-model
      AI_RULEZ_LLM_MAX_CALLS: "3"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Test floating tag safety checks
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p 'test_update_action_tag.py' -v
      - name: Install the public CLI with this action implementation
        id: setup
        uses: ./
        with:
          version: 5.4.0
          llm-model: gpt-4o-mini
          llm-api-key-env: ACTION_TEST_KEY
          llm-allow-network: "false"
          llm-max-cost-usd: "0.10"
          llm-cache: "false"
      - name: Verify outputs, PATH and persisted configuration without model requests
        env:
          INSTALLED_VERSION: ${{ steps.setup.outputs.version }}
          INSTALLED_PATH: ${{ steps.setup.outputs.path }}
          ACTION_TEST_KEY: test-not-a-real-credential
        run: |
          set -euo pipefail
          test "$INSTALLED_VERSION" = 5.4.0
          test -f "$INSTALLED_PATH"
          test "$AI_RULEZ_LLM_PROVIDER" = openai
          test "$AI_RULEZ_LLM_MODEL" = gpt-4o-mini
          test "$AI_RULEZ_LLM_API_KEY_ENV" = ACTION_TEST_KEY
          test "$AI_RULEZ_LLM_ALLOW_NETWORK" = false
          test "$AI_RULEZ_LLM_MAX_COST_USD" = 0.10
          test "$AI_RULEZ_LLM_MAX_CALLS" = 3
          test "$AI_RULEZ_LLM_CACHE" = false
          test "$(ai-rulez version)" = 'ai-rulez version 5.4.0'
          project="$(mktemp -d)"
          mkdir -p "$project/.ai-rulez"
          printf 'version = "5.0"\nname = "Action smoke test"\nbuiltins = false\n' >"$project/.ai-rulez/config.toml"
          cd "$project"
          ai-rulez llm doctor

  check:
    name: Check sub-action on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      # The action source goes to a subdirectory; the workspace root becomes a fixture repository,
      # which the check sub-action inspects as it would a consumer's checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: action-src
      - name: Install the CLI to build the fixture
        uses: ./action-src
        with:
          version: 5.7.0
      - name: Create a fixture with a root and a module configuration
        env:
          AI_RULEZ_ACK_COMMANDS: "1"
        run: |
          set -euo pipefail
          git init -q
          git config user.name fixture
          git config user.email fixture@example.com
          for dir in . module; do
            mkdir -p "$dir/.ai-rulez/rules"
            printf 'version = "5.0"\nname = "fixture"\nbuiltins = false\npresets = ["claude", "cursor"]\n' \
              >"$dir/.ai-rulez/config.toml"
            printf -- '---\npriority: high\n---\n# Fixture\n\nKeep the fixture small.\n' \
              >"$dir/.ai-rulez/rules/fixture.md"
            (cd "$dir" && ai-rulez migrate okf --quiet && rm -rf .ai-rulez.bak-okf-* &&
              ai-rulez generate --no-local --quiet && ai-rulez lock --content-only --quiet)
          done
          git add -A -- . ':(exclude)action-src'
          git commit -q -m fixture
      - name: Run the check sub-action
        id: check
        uses: ./action-src/check
        with:
          version: 5.7.0
          expected-config-count: "2"
      - name: Verify the outputs
        env:
          ROOTS: ${{ steps.check.outputs.roots }}
          FILES: ${{ steps.check.outputs.files-examined }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          test "$ROOTS" = 2
          test "$FILES" -gt 0
          test "$VERSION" = 5.7.0
      - name: Break a generated file
        run: printf 'hand edit\n' >>CLAUDE.md && git commit -q -am 'hand edit'
      - name: Run the check sub-action against drift
        id: drift
        continue-on-error: true
        uses: ./action-src/check
        with:
          version: 5.7.0
      - name: Require the drift to fail the gate
        env:
          OUTCOME: ${{ steps.drift.outcome }}
        run: test "$OUTCOME" = failure
