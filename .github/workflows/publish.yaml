name: Publish Packages

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g., v2.3.1)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; each job below asks for what it needs.
permissions:
  contents: read

jobs:
  meta:
    name: Resolve versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      python_version: ${{ steps.version.outputs.python_version }}
      tag: ${{ steps.version.outputs.tag }}
      npm_exists: ${{ steps.published.outputs.npm_exists }}
      pypi_exists: ${{ steps.published.outputs.pypi_exists }}
      release_assets_exist: >-
        ${{ steps.release_assets.outputs.release_assets_exist }}
      provenance_exists: >-
        ${{ steps.release_assets.outputs.provenance_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: >-
            ${{
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.tag ||
              ''
            }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Extract version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          version="${tag#v}"
          python_version="$(echo "$version" | sed 's/-rc\.//g; s/-rc/rc/')"

          {
            echo "version=$version"
            echo "python_version=$python_version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          echo "Git tag: $tag"
          echo "npm version: $version"
          echo "Python version: $python_version"

      - name: Detect already-published versions
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PYTHON_VERSION: ${{ steps.version.outputs.python_version }}
        run: |
          version="$VERSION"
          python_version="$PYTHON_VERSION"

          npm_exists=false
          if npm view "ai-rulez@${version}" version >/dev/null 2>&1; then
            npm_exists=true
          fi

          pypi_exists=false
          pypi_url="https://pypi.org/pypi/ai-rulez/${python_version}/json"
          if curl -fsS "$pypi_url" >/dev/null; then
            pypi_exists=true
          fi

          {
            echo "npm_exists=$npm_exists"
            echo "pypi_exists=$pypi_exists"
          } >> "$GITHUB_OUTPUT"

          echo "Already published?"
          echo "  npm:  $npm_exists"
          echo "  PyPI: $pypi_exists"

      - name: Detect existing GitHub release assets
        id: release_assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          tag="$TAG"
          release_assets_exist=false
          provenance_exists=false

          if gh release view "$tag" >/dev/null 2>&1; then
            count="$(
              gh release view "$tag" --json assets --jq '.assets | length'
            )"
            if [ "${count:-0}" -gt 0 ]; then
              release_assets_exist=true
            fi
            prov="$(
              gh release view "$tag" --json assets \
                --jq '[.assets[] | select(.name | endswith(".sigstore.json"))] | length'
            )"
            if [ "${prov:-0}" -gt 0 ]; then
              provenance_exists=true
            fi
          fi

          {
            echo "release_assets_exist=$release_assets_exist"
            echo "provenance_exists=$provenance_exists"
          } >> "$GITHUB_OUTPUT"
          echo "GitHub release assets exist? $release_assets_exist"
          echo "Provenance bundles exist? $provenance_exists"

  release_assets:
    name: Publish GitHub release assets
    needs: meta
    if: needs.meta.outputs.release_assets_exist != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: >-
            ${{
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.tag ||
              ''
            }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=validate --parallelism 1 --timeout 60m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # One SLSA provenance statement over every release binary and archive, signed
  # with this workflow's identity: `ai-rulez verify --self` checks the binary's
  # sha256 against it (docs/signing.md). It attests the assets as published, so
  # it also runs when release_assets was skipped because the release already
  # exists: a rerun after a failed attestation creates the missing provenance.
  provenance:
    name: Attest build provenance
    needs: [meta, release_assets]
    if: >-
      ${{
        !cancelled() &&
        needs.meta.result == 'success' &&
        (needs.release_assets.result == 'success' ||
         needs.release_assets.result == 'skipped') &&
        (needs.release_assets.result == 'success' ||
         needs.meta.outputs.provenance_exists != 'true')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern '*.tar.gz' --pattern '*.zip'

      - name: Unpack the binaries
        run: |
          set -euo pipefail
          cd dist
          for archive in *.tar.gz *.zip; do
            name="${archive%.tar.gz}"
            name="${name%.zip}"
            mkdir -p "unpacked/$name"
            case "$archive" in
              *.tar.gz) tar -xzf "$archive" -C "unpacked/$name" ai-rulez ;;
              *.zip) unzip -q "$archive" ai-rulez.exe -d "unpacked/$name" ;;
            esac
          done

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/unpacked/*/ai-rulez
            dist/unpacked/*/ai-rulez.exe
            dist/*.tar.gz
            dist/*.zip

      - name: Upload provenance bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # verify --self reads one bundle, not a JSON Lines file.
          if [ "$(grep -c . "$BUNDLE")" -ne 1 ]; then
            echo "expected exactly one attestation in $BUNDLE" >&2
            exit 1
          fi
          mkdir -p provenance
          for archive in dist/*.tar.gz dist/*.zip; do
            name="$(basename "$archive")"
            name="${name%.tar.gz}"
            name="${name%.zip}"
            cp "$BUNDLE" "provenance/${name}.sigstore.json"
          done
          gh release upload "$TAG" provenance/*.sigstore.json --clobber

  publish_npm:
    name: Publish npm
    needs: meta
    if: needs.meta.outputs.npm_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: >-
            ${{
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.tag ||
              ''
            }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Copy README
        run: cp README.md release/npm/README.md

      - name: Set version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cd release/npm
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          cat package.json | grep "\"version\""

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ""
          RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          unset NODE_AUTH_TOKEN
          cd release/npm
          version="$RELEASE_VERSION"
          if [[ "$version" == *"-rc."* ]]; then
            npm_tag="beta"
          else
            npm_tag="latest"
          fi

          npm publish --provenance --access public --tag "$npm_tag"

  publish_pypi:
    name: Publish PyPI
    needs: meta
    if: needs.meta.outputs.pypi_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: >-
            ${{
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.tag ||
              ''
            }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build Python package
        env:
          RELEASE_VERSION: ${{ needs.meta.outputs.python_version }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          cp README.md release/pypi/README.md
          VERSION="$RELEASE_VERSION"
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" release/pypi/ai_rulez/__init__.py
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" release/pypi/__init__.py
          cd release/pypi
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/pypi/dist
          skip-existing: true
