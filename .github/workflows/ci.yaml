name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Install dependencies
        run: go mod download

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, so a local run with the same version matches CI; bump on purpose.
          version: v2.15.0
          args: --timeout=180m

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy -diff
          (cd tests/external && go mod tidy -diff)

  public-api:
    name: Public API (pkg/airulez)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Set up liter-llm (static library, as a release links it)
        uses: ./.github/actions/setup-liter-llm

      # tests/external is its own module: it imports ai-rulez as an outside
      # consumer would, so a break in what pkg/airulez exposes fails here.
      - name: Test as an external consumer
        working-directory: tests/external
        run: go test ./...

      # The compatibility gate: pkg/... may only change additively inside a
      # major version. It needs the network (module proxy and tags), so it runs
      # here only; with no v5 release yet there is nothing to compare against.
      - name: Compatibility with the last v5 release (gorelease)
        run: |
          base=$(git tag --list 'v5.*' --sort=-v:refname | grep -v -- '-' | head -n1 || true)
          if [ -z "$base" ]; then
            echo "::notice::no v5 release to compare pkg/airulez against yet"
            exit 0
          fi
          go install golang.org/x/exp/cmd/gorelease@v0.0.0-20261014143641-f0251eb4aa3e
          # gorelease passes the deprecated `go get -d`, which Go 1.27 rejects with a
          # message it treats as failure, and its temporary load module omits the `go`
          # directive, so the module graph is not pruned and a broken transitive go.mod
          # (go-openapi/swag) breaks resolution. Shim `go` to drop -d and add the
          # directive before the resolution runs.
          GORELEASE_REAL_GO="$(command -v go)"
          export GORELEASE_REAL_GO
          shim="$(mktemp -d)"
          cat > "$shim/go" <<'SHIM'
          #!/usr/bin/env bash
          if [ "$1" = get ] && [ -f go.mod ] && ! grep -qE '^go [0-9]' go.mod; then
            printf '\ngo %s\n' "$("$GORELEASE_REAL_GO" env GOVERSION | sed 's/^go//')" >> go.mod
          fi
          args=(); for a in "$@"; do [ "$a" = -d ] || args+=("$a"); done
          exec "$GORELEASE_REAL_GO" "${args[@]}"
          SHIM
          chmod +x "$shim/go"
          out="$RUNNER_TEMP/gorelease.txt"
          status=0
          PATH="$shim:$PATH" gorelease -base="$base" > "$out" 2>&1 || status=$?
          cat "$out"
          [ "$status" -eq 0 ] && exit 0
          # A retracted module that only a dependency's go.mod requires (no package
          # imports it, so go.mod cannot move it) is not an API change: warn on it,
          # and fail on incompatible changes or any other diagnostic.
          grep 'retracted by module author' "$out" | sed 's/^/::warning::/' || true
          grep -q '^# summary' "$out" || exit 1
          grep -q '^## incompatible changes' "$out" && exit 1
          if sed -n '/^# diagnostics/,/^# summary/p' "$out" |
            grep -v -e '^#' -e '^$' -e 'retracted by module author' | grep -q .; then
            exit 1
          fi

  npm-wrapper:
    name: npm wrapper (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run npm wrapper tests
        run: node --test release/npm/install.test.js

  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Record Windows Go cache paths
        if: runner.os == 'Windows'
        id: go-cache-paths
        shell: bash
        run: |
          printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          printf 'build=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Set up liter-llm (static library, as a release links it)
        uses: ./.github/actions/setup-liter-llm

      - name: Install dependencies
        run: go mod download

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The runner account is an administrator, so symlink creation is allowed;
      # enable Developer Mode too and set AI_RULEZ_REQUIRE_SYMLINKS so the
      # symlink tests fail instead of skipping if that ever stops being true.
      - name: Enable symlinks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
          "AI_RULEZ_REQUIRE_SYMLINKS=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The Ubuntu and macOS runners ship Chrome: the catalog browser tests must
      # run there, so a Chrome that is missing or does not start fails them.
      - name: Require the browser tests (Ubuntu, macOS)
        if: runner.os != 'Windows'
        run: echo "AI_RULEZ_REQUIRE_BROWSER=1" >> "$GITHUB_ENV"

      - name: Run all tests (unit + platform)
        env:
          TEST_TIMEOUT: 180m
          COMMAND_TEST_LOG_DIR: ${{ runner.temp }}/command-test-shards
        run: task test

      - name: Run cross-platform specific tests
        run: task test:platform

      # The generator characterization goldens (they skip on Windows).
      - name: Run golden tests
        run: go test ./tests/golden/...

      # setup-go only saves on success. Preserve valid compiled objects after
      # a test failure too, using the key of the pinned setup-go v7 action.
      - name: Preserve Windows Go cache after failure
        if: failure() && runner.os == 'Windows' && steps.setup-go.outputs.cache-hit != 'true' && steps.go-cache-paths.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.modules }}
            ${{ steps.go-cache-paths.outputs.build }}
          key: setup-go-Windows-x64-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/command-test-shards/
            coverage.out
            *.log
          retention-days: 7

  e2e-test:
    name: E2E Tests - ${{ matrix.os }} - ${{ matrix.test-suite }}
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    timeout-minutes: 180
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        test-suite: [cli, mcp, integration]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Set up liter-llm (static library, as a release links it)
        uses: ./.github/actions/setup-liter-llm

      - name: Install dependencies
        run: go mod download

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binary for tests
        run: task build

      - name: Run e2e tests - ${{ matrix.test-suite }}
        run: |
          echo "::group::E2E Tests - ${{ matrix.test-suite }}"
          go test -timeout 180m ./tests/e2e/${{ matrix.test-suite }}/...
          echo "::endgroup::"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.os }}-${{ matrix.test-suite }}
          path: tests/e2e/*.log
          retention-days: 7

  # The tests that need real containers: publish --to oci against registry:3.1.2
  # and telemetry export to an OpenTelemetry Collector. They skip elsewhere.
  docker-e2e:
    name: Docker E2E (registry, collector)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Set up liter-llm (static library, as a release links it)
        uses: ./.github/actions/setup-liter-llm

      - name: Pull the pinned images
        run: |
          docker pull registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
          docker pull otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6

      - name: Run the docker-backed tests
        env:
          AI_RULEZ_E2E_DOCKER: "1"
          AI_RULEZ_LIVE_PUBLISH: "1"
          AI_RULEZ_E2E_OTELCOL: "1"
          AI_RULEZ_LIVE_OTEL: "1"
        run: >-
          go test -count=1 -timeout 180m -v
          -run 'TestDocker|TestLive_RegistryV2RoundTrip|TestCollector|TestLiveCollector'
          ./tests/e2e/cli/ ./internal/publish/oci/ ./internal/telemetry/

  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The regression check builds the base revision next to HEAD, so it needs the history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Set up liter-llm (static library, as a release links it)
        uses: ./.github/actions/setup-liter-llm

      - name: Install dependencies
        run: go mod download

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binary for benchmarks
        run: task build

      # Every benchmark runs once (-benchtime=1x): proves they still run, measures nothing.
      # shell: bash runs with pipefail, so a failing benchmark is not hidden by tee.
      - name: Run benchmarks once
        shell: bash
        env:
          TEST_TIMEOUT: 180m
        run: task test:benchmark:smoke | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 30

      # The curated subset at the base revision and at HEAD on this runner, interleaved
      # (-count 6 each): fails only when a benchmark is more than 20% slower and the
      # difference is significant (Mann-Whitney U, p < 0.05). No committed baseline is
      # read; see docs/performance.md. The base is the pull request's base commit, or the
      # parent of the pushed commit (a new branch or a force push falls back to HEAD^).
      - name: Benchmark regression check
        shell: bash
        env:
          BENCH_OUT: bench-subset.txt
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${BASE_SHA:-}" ] && ! [[ "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            export BENCH_BASE="$BASE_SHA"
          else
            export BENCH_BASE="HEAD^"
          fi
          scripts/bench.sh --compare

      - name: Upload benchmark subset
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-subset
          path: bench-subset.txt
          retention-days: 30

  comprehensive-test:
    name: Comprehensive Test Suite - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [lint]
    timeout-minutes: 180
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Record Windows Go cache paths
        if: runner.os == 'Windows'
        id: go-cache-paths
        shell: bash
        run: |
          printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          printf 'build=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Set up liter-llm (static library, as a release links it)
        uses: ./.github/actions/setup-liter-llm

      - name: Install dependencies
        run: go mod download

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binary for tests
        run: task build

      - name: Run all test suites (unit + platform + e2e)
        env:
          TEST_TIMEOUT: 180m
          COMMAND_TEST_LOG_DIR: ${{ runner.temp }}/command-test-shards
        run: task test:all

      # setup-go only saves on success. Preserve valid compiled objects after
      # a test failure too, using the key of the pinned setup-go v7 action.
      - name: Preserve Windows Go cache after failure
        if: failure() && runner.os == 'Windows' && steps.setup-go.outputs.cache-hit != 'true' && steps.go-cache-paths.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.modules }}
            ${{ steps.go-cache-paths.outputs.build }}
          key: setup-go-Windows-x64-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}

      - name: Upload comprehensive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-test-results-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/command-test-shards/
            coverage.out
            tests/e2e/*.log
            *.log
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [lint, test, e2e-test, comprehensive-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Set up liter-llm (static library, as a release links it)
        uses: ./.github/actions/setup-liter-llm

      - name: Install dependencies
        run: go mod download

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binary
        run: task build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/
