name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, so a local run with the same version matches CI; bump on purpose.
          version: v2.14.0
          args: --timeout=10m

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      # -e: the literllm-tagged import of internal/llm/literllm is a separate
      # module the default graph leaves out on purpose, so tidy cannot resolve it.
      - name: go.mod and go.sum are tidy
        env:
          GOWORK: "off"
        run: |
          go mod tidy -e -diff
          (cd tests/external && go mod tidy -e -diff)

  literllm:
    name: Native backend (-tags literllm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Build and test with -tags literllm
        env:
          CGO_ENABLED: "1"
        run: |
          (cd internal/llm/literllm && GOWORK=off go test -tags literllm ./...)
          GOWORK="$PWD/literllm.work" go build -tags literllm -o /dev/null ./cmd/ai-rulez

  public-api:
    name: Public API (pkg/airulez)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      # tests/external is its own module: it imports ai-rulez as an outside
      # consumer would, so a break in what pkg/airulez exposes fails here.
      - name: Test as an external consumer
        working-directory: tests/external
        run: go test ./...

      # The compatibility gate: pkg/... may only change additively inside a
      # major version. It needs the network (module proxy and tags), so it runs
      # here only; with no v5 release yet there is nothing to compare against.
      - name: Compatibility with the last v5 release (gorelease)
        run: |
          base=$(git tag --list 'v5.*' --sort=-v:refname | grep -v -- '-' | head -n1 || true)
          if [ -z "$base" ]; then
            echo "::notice::no v5 release to compare pkg/airulez against yet"
            exit 0
          fi
          go install golang.org/x/exp/cmd/gorelease@latest
          gorelease -base="$base"

  npm-wrapper:
    name: npm wrapper (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run npm wrapper tests
        run: node --test release/npm/install.test.js

  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The runner account is an administrator, so symlink creation is allowed;
      # enable Developer Mode too and set AI_RULEZ_REQUIRE_SYMLINKS so the
      # symlink tests fail instead of skipping if that ever stops being true.
      - name: Enable symlinks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
          "AI_RULEZ_REQUIRE_SYMLINKS=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The Ubuntu and macOS runners ship Chrome: the catalog browser tests must
      # run there, so a Chrome that is missing or does not start fails them.
      - name: Require the browser tests (Ubuntu, macOS)
        if: runner.os != 'Windows'
        run: echo "AI_RULEZ_REQUIRE_BROWSER=1" >> "$GITHUB_ENV"

      - name: Run all tests (unit + platform)
        run: task test

      - name: Run cross-platform specific tests
        run: task test:platform

      # The generator characterization goldens (they skip on Windows).
      - name: Run golden tests
        run: go test ./tests/golden/...

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            coverage.out
            *.log
          retention-days: 7

  e2e-test:
    name: E2E Tests - ${{ matrix.os }} - ${{ matrix.test-suite }}
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        test-suite: [cli, mcp, integration]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binary for tests
        run: task build

      - name: Run e2e tests - ${{ matrix.test-suite }}
        run: |
          echo "::group::E2E Tests - ${{ matrix.test-suite }}"
          go test -timeout 20m ./tests/e2e/${{ matrix.test-suite }}/...
          echo "::endgroup::"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.os }}-${{ matrix.test-suite }}
          path: tests/e2e/*.log
          retention-days: 7

  # The tests that need real containers: publish --to oci against registry:2
  # and telemetry export to an OpenTelemetry Collector. They skip elsewhere.
  docker-e2e:
    name: Docker E2E (registry, collector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Pull the pinned images
        run: |
          docker pull registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          docker pull otel/opentelemetry-collector-contrib:0.130.0@sha256:867d1074c2f750936fb9358ec9eefa009308053cf156b2c7ca1761ba5ef78452

      - name: Run the docker-backed tests
        env:
          AI_RULEZ_E2E_DOCKER: "1"
          AI_RULEZ_LIVE_PUBLISH: "1"
          AI_RULEZ_E2E_OTELCOL: "1"
          AI_RULEZ_LIVE_OTEL: "1"
        run: >-
          go test -count=1 -timeout 20m -v
          -run 'TestDocker|TestLive_RegistryV2RoundTrip|TestCollector|TestLiveCollector'
          ./tests/e2e/cli/ ./internal/publish/oci/ ./internal/telemetry/

  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binary for benchmarks
        run: task build

      - name: Run benchmarks
        run: task test:benchmark | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 30

  comprehensive-test:
    name: Comprehensive Test Suite - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [lint]
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binary for tests
        run: task build

      - name: Run all test suites (unit + platform + e2e)
        run: task test:all

      - name: Upload comprehensive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-test-results-${{ matrix.os }}
          path: |
            coverage.out
            tests/e2e/*.log
            *.log
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, e2e-test, comprehensive-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binary
        run: task build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/
