name: AI-Rulez validation
on:
  push:
    branches: [main]
    paths:
      - ".ai-rulez/**"
      - "modules/**"
      - "plugin/**"
      - "skills/**"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex/**"
      - "scripts/sync*"
      - "Cargo.toml"
      - "pyproject.toml"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/ai-rulez-validation.yml"
  pull_request:
    paths:
      - ".ai-rulez/**"
      - "modules/**"
      - "plugin/**"
      - "skills/**"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex/**"
      - "scripts/sync*"
      - "Cargo.toml"
      - "pyproject.toml"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/ai-rulez-validation.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-ai-rulez@v1
        with:
          ai-rulez-version: "5.9.2"
          source-revision: "a2b5c73f34e133dd0a87f40576986b327d21913a"
      - uses: xberg-io/actions/validate-ai-rulez@v1
