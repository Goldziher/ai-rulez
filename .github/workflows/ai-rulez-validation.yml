name: AI-Rulez validation
on:
  push:
    branches: [main]
    paths:
      - ".ai-rulez/**"
      - "modules/**"
      - "plugin/**"
      - "skills/**"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex/**"
      - "scripts/sync*"
      - "Cargo.toml"
      - "pyproject.toml"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/ai-rulez-validation.yml"
  pull_request:
    paths:
      - ".ai-rulez/**"
      - "modules/**"
      - "plugin/**"
      - "skills/**"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex/**"
      - "scripts/sync*"
      - "Cargo.toml"
      - "pyproject.toml"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/ai-rulez-validation.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: xberg-io/actions/setup-ai-rulez@cc89740654cef67b752113ddd87d4f0d23dda3f5
        with:
          ai-rulez-version: "5.6.3"
          source-revision: "d4a0cbe4712319312104ba3f2a618ef55645ef9f"
      - uses: xberg-io/actions/validate-ai-rulez@cc89740654cef67b752113ddd87d4f0d23dda3f5
