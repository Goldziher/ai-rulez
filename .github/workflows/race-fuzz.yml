name: Race and fuzz

# The race detector on the concurrency-heavy packages, and a short scheduled
# fuzz pass. ci.yaml runs the plain test suite.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: race-fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  race:
    name: Race detector
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"

      - name: Test with -race
        run: >-
          go test -race -count=1 -timeout 20m
          ./internal/includes/...
          ./internal/telemetry/...
          ./internal/runner/...
          ./internal/lockrun/...
          ./internal/mcp/...

  fuzz:
    name: Fuzz ${{ matrix.target }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzValidate, pkg: ./internal/llmstxt }
          - { target: FuzzValidate, pkg: ./internal/ard }
          - { target: FuzzValidateImport, pkg: ./internal/agentplugins }
          - { target: FuzzParse, pkg: ./internal/lockfile }
          - { target: FuzzFrontmatterSplittersAgree, pkg: ./internal/fmdiff }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"

      - name: Fuzz for 60 seconds
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 60s ${{ matrix.pkg }}

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-${{ matrix.target }}
          path: "**/testdata/fuzz/${{ matrix.target }}/"
          if-no-files-found: ignore
