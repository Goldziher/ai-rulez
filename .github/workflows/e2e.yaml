# Nightly and manual full e2e run. Pull requests and pushes are covered by the
# e2e-test and comprehensive-test jobs in ci.yaml.
name: E2E Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprehensive-e2e:
    name: Comprehensive E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Cache Task binary
        uses: actions/cache@v6
        id: task-cache
        with:
          path: |
            ~/.task
            ~/bin/task
          key: ${{ runner.os }}-task-3.x
          restore-keys: |
            ${{ runner.os }}-task-

      - name: Install Task
        uses: arduino/setup-task@v3
        if: steps.task-cache.outputs.cache-hit != 'true'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binary for tests
        run: task build

      - name: Run all e2e tests
        run: task test:e2e

      - name: Upload comprehensive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-e2e-results
          path: |
            tests/e2e/*.log
            tests/e2e/**/*.prof
          retention-days: 7
