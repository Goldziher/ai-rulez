# Nightly and manual full e2e run. Pull requests and pushes are covered by the
# e2e-test and comprehensive-test jobs in ci.yaml.
name: E2E Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprehensive-e2e:
    name: Comprehensive E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-toolchain
        with:
          restore-keys: "true"

      - name: Install dependencies
        run: go mod download

      - name: Build binary for tests
        run: mise run build

      - name: Run all e2e tests
        env:
          TEST_TIMEOUT: 180m
        run: mise run test:e2e

      - name: Upload comprehensive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comprehensive-e2e-results
          path: |
            tests/e2e/*.log
            tests/e2e/**/*.prof
          retention-days: 7
