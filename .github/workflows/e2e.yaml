# Nightly and manual full e2e run. Pull requests and pushes are covered by the
# e2e-test and comprehensive-test jobs in ci.yaml.
name: E2E Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprehensive-e2e:
    name: Comprehensive E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Cache Task binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: task-cache
        with:
          path: |
            ~/.task
            ~/bin/task
          key: ${{ runner.os }}-task-3.x
          restore-keys: |
            ${{ runner.os }}-task-

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        if: steps.task-cache.outputs.cache-hit != 'true'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binary for tests
        run: task build

      - name: Run all e2e tests
        run: task test:e2e

      - name: Upload comprehensive test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: comprehensive-e2e-results
          path: |
            tests/e2e/*.log
            tests/e2e/**/*.prof
          retention-days: 7
