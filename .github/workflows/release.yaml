name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  publish-npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    if: always() && (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'failure')
    steps:
      - uses: actions/checkout@v4

      - name: Check if GitHub release exists
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if ! gh release view v$VERSION > /dev/null 2>&1; then
            echo "GitHub release v$VERSION does not exist, skipping npm publish"
            exit 1
          fi
          echo "GitHub release v$VERSION exists, proceeding with npm publish"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Update package version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cd build/npm
          # Use sed to update version directly to avoid npm version conflicts
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          echo "Updated package.json version to $VERSION"
          cat package.json | grep version

      - name: Publish to npm
        run: |
          cd build/npm
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    needs: goreleaser
    runs-on: ubuntu-latest
    if: always() && (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'failure')
    steps:
      - uses: actions/checkout@v4

      - name: Check if GitHub release exists
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if ! gh release view v$VERSION > /dev/null 2>&1; then
            echo "GitHub release v$VERSION does not exist, skipping PyPI publish"
            exit 1
          fi
          echo "GitHub release v$VERSION exists, proceeding with PyPI publish"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install build twine

      - name: Build package
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Building Python package with version $VERSION"
          # Wait a bit for GitHub release to be fully available
          echo "Waiting for GitHub release to be available..."
          sleep 120
          cd build/python
          RELEASE_VERSION=$VERSION python -m build

      - name: Publish to PyPI
        run: |
          cd build/python
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}