name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without v prefix)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

  goreleaser:
    needs: prepare
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  publish-npm:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check if GitHub release exists
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          if ! gh release view v$VERSION > /dev/null 2>&1; then
            echo "GitHub release v$VERSION does not exist, skipping npm publish"
            exit 1
          fi
          echo "GitHub release v$VERSION exists, proceeding with npm publish"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Copy README
        run: cp README.md release/npm/README.md

      - name: Set version
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          cd release/npm
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          cat package.json | grep version

      - name: Publish to npm
        run: |
          cd release/npm
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check if GitHub release exists
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          if ! gh release view v$VERSION > /dev/null 2>&1; then
            echo "GitHub release v$VERSION does not exist, skipping PyPI publish"
            exit 1
          fi
          echo "GitHub release v$VERSION exists, proceeding with PyPI publish"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install build twine

      - name: Update Python package version
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          echo "Updating Python package version to $VERSION"
          # Update version in __init__.py files
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" release/pypi/ai_rulez/__init__.py
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" release/pypi/__init__.py
          echo "Updated __init__.py files to version $VERSION"
          
      - name: Build package
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          echo "Building Python package with version $VERSION"
          # Wait a bit for GitHub release to be fully available
          echo "Waiting for GitHub release to be available..."
          sleep 120
          cd release/pypi
          # Copy root README to PyPI package directory
          cp ../../README.md ./README.md
          echo "Copied README.md to PyPI package directory"
          RELEASE_VERSION=$VERSION python -m build

      - name: Publish to PyPI
        run: |
          cd release/pypi
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
