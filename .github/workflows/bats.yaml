name: Bats

on:
  push:
    branches: [main, develop]
    paths: &bats-paths
      - "scripts/**"
      - "tests/bats/**"
      - "tests/lib/**"
      - "internal/hooks/**"
      - "internal/generator/settings/**"
      - "internal/improve/adapter/**"
      - "internal/lint/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - "mise.lock"
      - "mise-tasks/**"
      - "mise.ci.toml"
      - "toolchains.toml"
      - "scripts/mise/**"
      - ".github/actions/go-toolchain/**"
      - ".github/workflows/bats.yaml"
  pull_request:
    branches: [main]
    paths: *bats-paths
  workflow_dispatch:

concurrency:
  group: bats-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bats:
    name: Bats on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Both: the pre-commit script maps uname per platform and the suites shadow the host's
        # system bins, which differ between the two images.
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-toolchain

      # The suites that check emitted scripts (Cline hooks, the Husky hook, the improve template,
      # the rule docs) render them through a binary built from this commit.
      - name: Build ai-rulez
        run: |
          go build -o "$RUNNER_TEMP/ai-rulez" ./cmd/ai-rulez
          echo "AI_RULEZ_BATS_BIN=$RUNNER_TEMP/ai-rulez" >>"$GITHUB_ENV"

      - name: Install locked Bats
        uses: xberg-io/actions/setup-mise@v1
        with:
          tools: bats

      - name: Run the shell script suites
        uses: xberg-io/actions/run-bats@v1
        with:
          path: tests/bats
          # bats_load_library searches BATS_LIB_PATH only; scripts/bats/run.sh sets the same path.
          lib-path: tests/lib
          args: |-
            --recursive
            --print-output-on-failure

  lib:
    name: Vendored xberg-bats and Bats lint
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      # poly has no engine for .bats, so the suites are linted directly, with the shfmt and
      # shellcheck mise.toml pins.
      - name: Install shfmt and shellcheck
        uses: xberg-io/actions/setup-mise@v1
        with:
          tools: shfmt shellcheck

      - name: Check tests/lib/xberg-bats against the pinned xberg-io/actions commit
        run: mise run test:lib:check

      - name: Lint the Bats suites
        run: mise run lint:bats
