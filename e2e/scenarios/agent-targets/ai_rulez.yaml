metadata:
  name: "Test Agent Targets"
  version: "1.0.0"
  description: "Test that agents with targets are correctly filtered for directory outputs"

targets:
  claude-files:
    - "CLAUDE.md"
    - ".claude/**/*.md"

outputs:
  - file: "CLAUDE.md"
    template: |
      # Claude AI Assistant Rules
      
      {{ range .Rules }}
      ## {{ .Name }}
      {{ .Content }}
      {{ end }}
  
  - path: ".claude/agents/"
    type: "agent"
    naming_scheme: "{priority:02d}-{name}.md"
    template: |
      # Agent: {{ .Name }}
      
      **Description**: {{ .Description }}
      **Priority**: {{ .Priority }}
      
      ## System Prompt
      {{ .SystemPrompt }}

agents:
  - name: "test-agent-with-target"
    description: "Agent that targets Claude files"
    priority: 10
    targets: ["@claude-files"]
    system_prompt: |
      You are a test agent that should only appear in Claude-related outputs.
      This agent is filtered by the @claude-files target group.

  - name: "test-agent-no-target"
    description: "Agent with no targets (appears everywhere)"
    priority: 5
    system_prompt: |
      You are a test agent with no target restrictions.
      This agent should appear in all agent outputs.

rules:
  - name: "Test Rule"
    priority: 10
    content: "This is a test rule for the e2e test."