metadata:
  name: "Agent Test Project"
  version: "1.0.0"
  description: "Test project with AI agents"

outputs:
  - path: "CLAUDE.md"
    template: "default"
  
  - path: ".claude/agents/"
    type: "agent"
    naming_scheme: "{name}.md"

rules:
  - name: "Code Quality"
    priority: 10
    content: "Maintain high code quality standards"
  
  - name: "Documentation"
    priority: 8
    content: "Keep documentation up to date"

agents:
  - name: "code-reviewer"
    description: "Reviews code for quality and best practices"
    priority: 10
    tools:
      - "read"
      - "analyze"
      - "comment"
    system_prompt: |
      You are an expert code reviewer. Focus on:
      - Code quality and maintainability
      - Best practices and design patterns
      - Performance considerations
      - Security vulnerabilities
  
  - name: "test-generator"
    description: "Generates comprehensive test cases"
    priority: 8
    tools:
      - "read"
      - "write"
      - "execute"
    template: "default"
  
  - name: "doc-writer"
    description: "Creates and maintains documentation"
    priority: 5
    tools:
      - "read"
      - "write"
    system_prompt: |
      You are a technical documentation specialist.
      Create clear, concise, and comprehensive documentation.