version: '3'

vars:
  BINARY_NAME: ai-rulez

tasks:
  build:
    desc: Build the binary
    deps:
      - sync-schema
    cmds:
      - go build -o bin/{{.BINARY_NAME}} ./cmd

  sync-schema:
    desc: Sync schema from main directory to embedded location
    cmds:
      - cp schema/ai-rules-v1.schema.json internal/config/ai-rules-v1.schema.json

  install:
    desc: Install the binary
    cmds:
      - go install ./cmd

  test:
    desc: Run unit tests
    cmds:
      - go test -timeout=30s -v ./internal/...

  test:coverage:
    desc: Run unit tests with coverage
    cmds:
      - go test -timeout=30s -v -coverprofile=coverage.out ./internal/...
      - go tool cover -html=coverage.out -o coverage.html

  test:race:
    desc: Run unit tests with race detection
    cmds:
      - go test -timeout=30s -race -v ./internal/...

  test:integration:
    desc: Run integration tests
    cmds:
      - cd e2e && go test -timeout=5m -v .

  test:benchmark:
    desc: Run benchmark tests
    cmds:
      - cd e2e && go test -timeout=10m -bench=. -benchmem .

  test:all:
    desc: Run all tests (unit + integration)
    deps: [test, test:integration]

  test:e2e:
    desc: Run all e2e tests
    cmds:
      - echo "🧪 Running all e2e tests for ai-rulez..."
      - task: test:e2e:init
      - task: test:e2e:cli
      - task: test:e2e:agents
      - task: test:e2e:profile
      - task: test:e2e:benchmark
      - echo "✅ All e2e tests completed!"

  test:e2e:init:
    desc: Run init provider e2e tests
    cmds:
      - echo "🧪 Running Init Provider Tests..."
      - cd e2e && go test -v -timeout=30s -run "TestInit" .

  test:e2e:cli:
    desc: Run CLI integration e2e tests
    cmds:
      - echo "🧪 Running CLI Integration Tests..."
      - cd e2e && go test -v -timeout=30s -run "TestCLIIntegration/Basic_Commands|TestCLIIntegration/Config_Discovery|TestCLIIntegration/Generation|TestCLIIntegration/Validation|TestCLIIntegration/Error_Handling" .

  test:e2e:agents:
    desc: Run agent and directory output e2e tests
    cmds:
      - echo "🧪 Running Agent Tests..."
      - cd e2e && go test -v -timeout=30s -run "TestCLIIntegration/Agents_and_Directory_Outputs" . || echo "⚠ Some agent tests failed (experimental)"

  test:e2e:profile:
    desc: Run profiling e2e tests
    cmds:
      - echo "🧪 Running Profile Tests..."
      - cd e2e && go test -v -timeout=30s -run "TestProfile" .

  test:e2e:benchmark:
    desc: Run benchmark e2e tests
    cmds:
      - echo "🧪 Running Benchmarks..."
      - cd e2e && go test -timeout=10m -bench=. -benchmem -run=^$ .

  test:e2e:full:
    desc: Run all e2e tests including benchmarks
    cmds:
      - cd e2e && go test -v -timeout=60s -count=1 ./...

  lint:
    desc: Lint the code
    cmds:
      - golangci-lint run

  lint:fix:
    desc: Fix linting issues
    cmds:
      - golangci-lint run --fix

  format:
    desc: Format code with go fmt
    cmds:
      - go fmt ./...

  fmt:
    desc: Format code (alias for format)
    deps: [format]

  tidy:
    desc: Tidy dependencies
    cmds:
      - go mod tidy

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/
      - rm -f coverage.out coverage.html

  setup:
    desc: Initial development environment setup
    cmds:
      - go mod tidy
      - go install github.com/evilmartians/lefthook@latest
      - lefthook install
      - pnpm install
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - echo "✅ Setup complete!"

  dev:
    desc: Development setup
    deps: [tidy, format, lint, test]

  ci:
    desc: Run all checks (like CI)
    deps: [tidy, format, lint, test:race, test:integration]

  ci:unit:
    desc: Run CI unit tests only
    deps: [tidy, format, lint, test:race]

  ci:integration:
    desc: Run CI integration tests only
    deps: [test:integration]

  build:all:
    desc: Build for multiple platforms
    cmds:
      - GOOS=linux GOARCH=amd64 go build -o bin/{{.BINARY_NAME}}-linux-amd64 .
      - GOOS=windows GOARCH=amd64 go build -o bin/{{.BINARY_NAME}}-windows-amd64.exe .
      - GOOS=darwin GOARCH=amd64 go build -o bin/{{.BINARY_NAME}}-darwin-amd64 .
      - GOOS=darwin GOARCH=arm64 go build -o bin/{{.BINARY_NAME}}-darwin-arm64 .