version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: "Install all dependencies and initialize project. Idempotent."
    cmds:
      - go mod download
      - prek install
      - prek install --hook-type commit-msg
      - echo "Setup complete"

  build:
    desc: Build the ai-rulez CLI binary
    cmds:
      - go build -o bin/ai-rulez ./cmd/main.go

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:verbose:
    desc: Run all tests with verbose output
    cmds:
      - go test -v ./...

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Run all linters and formatters via prek
    cmds:
      - prek run --all-files

  format:
    desc: Format Go code
    cmds:
      - gofmt -w .
      - goimports -w .

  check:
    desc: Run all checks (lint + test)
    cmds:
      - task: lint
      - task: test

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/
      - go clean -cache

  update:
    desc: Update all dependencies
    cmds:
      - go get -u ./...
      - go mod tidy
      - prek autoupdate

  generate:
    desc: Generate ai-rulez configuration files
    cmds:
      - go run ./cmd/main.go generate

  validate:
    desc: Validate ai-rulez configuration
    cmds:
      - go run ./cmd/main.go validate
