# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. ai-rulez itself is never pinned
# here: the governance tasks run `npx -y ai-rulez@latest`. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64", "windows-x64"]

[tools]
go = "1.27.3"
node = "26.12.1"
pnpm = "12.15.0"
python = "3.13.18"
uv = "0.13.6"
bats = "1.14.0"
actionlint = "1.7.12"
"github:Goldziher/poly" = "0.31.2"
# Repository-owned: poly probes these on PATH, and scripts/bats/lint.sh needs shfmt and shellcheck. CI's
# golangci-lint-action pins the same golangci-lint. ~keep
golangci-lint = "2.15.0"
shfmt = "3.14.1"
shellcheck = "0.11.0"
