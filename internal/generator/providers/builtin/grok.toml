# Grok Build CLI (xAI) provider spec.
#
# Grok reads AGENTS.md plus a flat scan of .grok/rules/*.md, skills from
# .grok/skills, subagents from .grok/agents (name + description frontmatter),
# slash commands from .grok/commands, and MCP servers from the
# [mcp_servers.<name>] tables of .grok/config.toml (the same relative paths
# serve the user scope under ~/.grok). The MCP table shape is verified against
# the grok CLI by the rulesync project, not by xAI's public docs.

name = "grok"
display_name = "Grok Build CLI"

directories = [".grok", ".grok/rules", ".grok/skills", ".grok/agents", ".grok/commands"]

[root]
file = "AGENTS.md"
local_file = "none"
sections = ["header", "title", "description", "rules_inline", "context_inline", "agents_delegation"]

[outputs.rules]
mode = "per_item_file"
dir = ".grok/rules"
filename = "{id}.md"
split = true
dialect = "junie"

[outputs.skills]
dir = ".grok/skills"
mode = "per_item_file"
filename = "{id}/SKILL.md"
resources = true

[outputs.skills.body]
sections = ["frontmatter", "content", "resource_index"]

[outputs.skills.frontmatter]
fields = ["description"]

[outputs.agents]
mode = "per_item_file"
dir = ".grok/agents"
filename = "{id}.md"

[outputs.agents.body]
sections = ["frontmatter", "content"]

[outputs.agents.frontmatter]
fields = ["description"]

[outputs.commands]
mode = "per_item_file"
dir = ".grok/commands"
filename = "{id}.md"

[outputs.commands.body]
sections = ["frontmatter", "content"]

[outputs.commands.frontmatter]
fields = ["description", "argument-hint"]
omit_name = true

[[sidecars]]
kind = "mcp"
path = ".grok/config.toml"
dialect = "grok"
global_path = ".grok/config.toml"

# Hooks: top-level [[hooks]] rendered in grok's native format, read from the
# vendor documentation (see docs/settings.md). Grok reads every .grok/hooks/*.json (Claude-style groups, seconds).
[[sidecars]]
kind = "hooks"
dialect = "grok"
path = ".grok/hooks/ai-rulez.json"
format = "json"
global_path = ".grok/hooks/ai-rulez.json"

# Top-level [permissions], translated to this tool's native permission format.
[[sidecars]]
kind = "permissions"
path = ".grok/config.toml"
dialect = "grok"
global_path = ".grok/config.toml"

[global]
root_file = ".grok/AGENTS.md"
skills_dir = ".grok/skills"
agents_dir = ".grok/agents"
commands_dir = ".grok/commands"
rules_dir = ".grok/rules"
