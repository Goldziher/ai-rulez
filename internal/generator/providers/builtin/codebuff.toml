# Codebuff (Freebuff) provider spec.
#
# Codebuff reads project knowledge from knowledge.md, then AGENTS.md, then
# CLAUDE.md (one per directory), so the shared AGENTS.md is the knowledge file;
# Agent Skills come from .agents/skills; and MCP servers from .agents/mcp.json.
# Its server schema is strict (stdio: type/command/args/env; remote:
# type/url/headers), which is the VS Code entry shape under the mcpServers key.
# https://www.codebuff.com/docs/tips/mcp-servers
# https://www.codebuff.com/docs/tips/knowledge-files

name = "codebuff"
display_name = "Codebuff"

directories = [".agents", ".agents/skills"]

[root]
file = "AGENTS.md"
# Codebuff reads no machine-local project file.
local_file = "none"
sections = ["header", "title", "description", "rules_inline", "context_inline", "agents_delegation"]

[outputs.skills]
mode = "per_item_file"
dir = ".agents/skills"
filename = "{id}/SKILL.md"
resources = true

[outputs.skills.body]
sections = ["frontmatter", "content", "resource_index"]

# .agents/skills is shared with codex, cursor and the agents_md tree, which write
# `name` first and a double-quoted description; the files must be byte-identical.
[outputs.skills.frontmatter]
fields = ["description"]
name_first = true
quoted_fields = ["description"]

[[sidecars]]
kind = "mcp"
path = ".agents/mcp.json"
format = "json"
key = ["mcpServers"]
dialect = "vscode"
# Codebuff expands $VAR_NAME from the shell itself.
env_ref_syntax = "dollar"
global_path = ".agents/mcp.json"
