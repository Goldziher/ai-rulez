# JetBrains Junie provider spec.
#
# Junie reads project guidance from AGENTS.md (the open standard). When a root
# AGENTS.md is present Junie combines it with every .junie/rules/*.md file, so
# rules go to the native rules folder and the root file keeps the always-on
# content. Per-agent, per-skill and per-command files sit alongside, and MCP
# servers go to .junie/mcp/mcp.json. No effort field. (The legacy .junie/guidelines.md layout is no longer written.)

name = "junie"
display_name = "JetBrains Junie"

directories = [".junie", ".junie/skills", ".junie/agents", ".junie/rules", ".junie/commands"]

# AGENTS.md inlines rules and context but NOT the agents-delegation section —
# Junie surfaces subagents through its own UI, not the root file. Junie is a
# native AGENTS.md reader, so it shares the file byte-for-byte with the other
# AGENTS.md presets.
[root]
file = "AGENTS.md"
# Junie never reads AGENTS.local.md, but it loads every .junie/rules/*.md, so
# the machine-local context goes there.
local_file = ".junie/rules/ai-rulez.local.md"
sections = ["header", "title", "description", "rules_inline", "context_inline", "agents_delegation"]

# Rules: .junie/rules/{id}.md, written in `[rules] mode = "split"` (the default).
# Junie has no glob activation, so in inline mode every rule stays
# in guidelines.md.
[outputs.rules]
mode = "per_item_file"
dir = ".junie/rules"
filename = "{id}.md"
split = true
dialect = "junie"

[outputs.skills]
mode = "per_item_file"
dir = ".junie/skills"
filename = "{id}/SKILL.md"
resources = true

[outputs.skills.body]
sections = ["frontmatter", "content", "resource_index"]

[outputs.skills.frontmatter]
fields = ["description"]

[outputs.agents]
mode = "per_item_file"
dir = ".junie/agents"
filename = "{id}.md"

[outputs.agents.body]
sections = ["frontmatter", "content"]

[outputs.agents.frontmatter]
fields = ["description", "disallowedTools", "allowPromptArgument"]
tools = true
skills = true
emit_model = true

# Custom slash commands: .junie/commands/{id}.md, invoked as /{id}.
[outputs.commands]
mode = "per_item_file"
dir = ".junie/commands"
filename = "{id}.md"

[outputs.commands.body]
sections = ["frontmatter", "content"]

[outputs.commands.frontmatter]
fields = ["description"]
omit_name = true

[model]
field = "model"

# Junie reads MCP servers from .junie/mcp/mcp.json (mcpServers, command/args/env
# or url/headers), in the project and under ~/.junie.
[[sidecars]]
kind = "mcp"
path = ".junie/mcp/mcp.json"
dialect = "standard"
global_path = ".junie/mcp/mcp.json"

# User-scope layout: Junie merges ~/.junie/AGENTS.md with the project guidelines.
[global]
root_file = ".junie/AGENTS.md"
skills_dir = ".junie/skills"
agents_dir = ".junie/agents"
commands_dir = ".junie/commands"
