# JetBrains Junie provider spec.
#
# Replaces the hand-written internal/generator/presets/junie.go. Junie reads
# project guidance from .junie/guidelines.md and supports per-agent and
# per-skill files alongside. No effort field; no sidecars.

name = "junie"
display_name = "JetBrains Junie"

directories = [".junie", ".junie/skills", ".junie/agents", ".junie/rules"]

# guidelines.md inlines rules and context but NOT the agents-delegation
# section — Junie surfaces subagents through its own UI, not the root file.
[root]
file = ".junie/guidelines.md"
sections = ["header", "title", "description", "rules_inline", "context_inline"]

# Rules: .junie/rules/{id}.md, written only with `[rules] mode = "split"`.
# Junie has no glob activation, so in the default inline mode every rule stays
# in guidelines.md.
[outputs.rules]
mode = "per_item_file"
dir = ".junie/rules"
filename = "{id}.md"
split = true
dialect = "junie"

[outputs.skills]
mode = "per_item_file"
dir = ".junie/skills"
filename = "{id}/SKILL.md"
resources = true

[outputs.skills.body]
sections = ["frontmatter", "content", "resource_index"]

[outputs.skills.frontmatter]
fields = ["description"]

[outputs.agents]
mode = "per_item_file"
dir = ".junie/agents"
filename = "{id}.md"

[outputs.agents.body]
sections = ["frontmatter", "content"]

[outputs.agents.frontmatter]
fields = ["description", "disallowedTools", "allowPromptArgument"]
tools = true
skills = true
emit_model = true

[model]
field = "model"
