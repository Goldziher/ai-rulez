# Hermes Agent project-context provider.
#
# Hermes loads .hermes.md as the highest-priority project instruction file,
# ahead of AGENTS.md, CLAUDE.md, and Cursor compatibility rules. Procedures
# remain in Hermes' user skill store or an explicitly configured external
# skill directory, so by default this preset emits project context only. With
# the agents_md flag it stops writing .hermes.md (it would shadow AGENTS.md)
# and reads the shared AGENTS.md and .agents/skills instead.

name = "hermes"
display_name = "Hermes Agent"

[root]
file = ".hermes.md"
# Hermes never reads .hermes.local.md. With agents_md it loads AGENTS.override.md
# (written by the generator); otherwise .hermes.md beats the AGENTS chain.
local_file = "none"
sections = ["header", "title", "description", "rules_inline", "context_inline", "agents_delegation"]

# User-scope layout: Hermes has no user-level rules file (~/.hermes/SOUL.md is an
# identity slot, not project guidance), and its home is relocatable.
[global]
home_env = "HERMES_HOME"
home_dir = ".hermes"
skills_dir = ".hermes/skills"
