# Sourcegraph Amp provider spec.
#
# Replaces the hand-written internal/generator/presets/amp.go. Amp reads
# project guidance from AGENTS.md and supports per-agent and per-skill
# files; custom subagent files (.agents/agents) are an Antigravity format Amp does
# not read, so agents are only listed in AGENTS.md. Global effort (the `amp.anthropic.effort` key) and the MCP servers
# (the flat `amp.mcpServers` key) are emitted via .amp/settings.json. Amp caps xhigh→high (it does not accept
# xhigh at the moment); max passes through.

name = "amp"
display_name = "Sourcegraph Amp"

directories = [".agents", ".agents/skills", ".agents/checks"]

[root]
file = "AGENTS.md"
# Amp reads no machine-local project file (only ~/.config/amp/AGENTS.md).
local_file = "none"
sections = ["header", "title", "description", "rules_inline", "context_inline", "agents_delegation"]

[outputs.skills]
mode = "per_item_file"
dir = ".agents/skills"
filename = "{id}/SKILL.md"
resources = true

[outputs.skills.body]
sections = ["frontmatter", "content", "resource_index"]

# .agents/skills is shared with codex, cursor and the agents_md tree, which write
# `name` first and a double-quoted description; the files must be byte-identical.
[outputs.skills.frontmatter]
fields = ["description"]
name_first = true
quoted_fields = ["description"]

# Code-review checks, one file per check (Amp's @amp/review-checks plugin). The
# name comes from the file name; severity is written as severity-default.
[outputs.checks]
mode = "per_item_file"
dir = ".agents/checks"
filename = "{id}.md"
filter = "include_if_targeting_provider"

[outputs.checks.body]
sections = ["frontmatter", "content"]

[outputs.checks.frontmatter]
fields = ["description", "severity"]
tools = true
renames = { severity = "severity-default" }

[model]
field = "model"

[effort_map]
style = "string"

[effort_map.values]
low = "low"
medium = "medium"
high = "high"
xhigh = "high"    # Amp does not currently accept xhigh — cap to high.
max = "max"

[[sidecars]]
kind = "amp_settings_json"
path = ".amp/settings.json"
global_path = ".config/amp/settings.json"
emit_when = "has_resolved_effort_or_mcp_servers"

# User-scope layout: Amp keeps its memory and settings under ~/.config/amp and
# shares skills through ~/.config/agents.
[global]
root_file = ".config/amp/AGENTS.md"
skills_dir = ".config/agents/skills"
