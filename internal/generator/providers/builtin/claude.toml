# Claude (Anthropic) provider spec.
#
# Replaces the hand-written internal/generator/presets/claude.go. The generic
# renderer in internal/generator/providers/render.go consumes this file and
# produces identical OutputFile slices for the registered "claude" preset.
#
# Spec schema: schema/provider.schema.json

name = "claude"
display_name = "Claude Code"

# Always-emitted IsDir markers — keep stale-file cleanup scoped correctly.
directories = [".claude", ".claude/skills", ".claude/agents"]

# CLAUDE.md is composed by walking these sections in order.
[root]
file = "CLAUDE.md"
sections = ["header", "title", "description", "rules_inline", "context_inline", "agents_delegation"]

# Skills: .claude/skills/{id}/SKILL.md with frontmatter, the skill body, a
# Resources index, and any rules/context that explicitly target this output.
# `resources = true` also emits the bundled references/ scripts/ assets/ files
# under the skill directory.
[outputs.skills]
mode = "per_item_file"
dir = ".claude/skills"
filename = "{id}/SKILL.md"
resources = true

[outputs.skills.body]
sections = ["frontmatter", "content", "resource_index", "targeted_rules", "targeted_context"]

[outputs.skills.frontmatter]
include_extras = true
extras_blacklist = ["priority", "targets"]

[outputs.skills.frontmatter.constants]
user_invocable = false

# Agents: .claude/agents/{id}.md with effort + model resolved from the shared
# resolvers, plus tools/skills lists and the standard scalar fields.
[outputs.agents]
mode = "per_item_file"
dir = ".claude/agents"
filename = "{id}.md"

[outputs.agents.body]
sections = ["frontmatter", "content", "targeted_rules", "targeted_context"]

[outputs.agents.frontmatter]
fields = ["description", "permission_mode"]
tools = true
skills = true
emit_effort = true
emit_model = true

# Commands are rendered as user-invokable skills (Claude exposes slash
# commands through the skills directory). Filter drops commands whose
# Metadata.Targets explicitly excludes claude.
[outputs.commands]
mode = "per_item_file"
dir = ".claude/skills"
filename = "{id}/SKILL.md"
filter = "include_if_targeting_provider"

[outputs.commands.body]
sections = ["frontmatter", "content", "targeted_rules", "targeted_context"]

[outputs.commands.frontmatter]
fields = ["description", "shortcut", "category"]
include_extras = true
extras_blacklist = ["priority", "targets", "shortcut", "category"]

[outputs.commands.frontmatter.constants]
user_invocable = true

# Model strings flow through verbatim — no per-tier translation needed.
[model]
field = "model"

# Effort is identity-mapped for Claude: the resolved tier (low/medium/high/
# xhigh/max) is emitted as-is. Codex / Opencode / etc. will diverge here.
[effort_map]
style = "string"

[effort_map.values]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

# Conditional sidecars driven by config presence.
[[sidecars]]
kind = "claude_settings_json"
path = ".claude/settings.json"
emit_when = "has_mcp_servers"

[[sidecars]]
kind = "claude_plugins_json"
path = ".claude/plugins.json"
emit_when = "has_plugins"
