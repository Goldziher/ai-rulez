# Claude (Anthropic) provider spec.
#
# Replaces the hand-written internal/generator/presets/claude.go. The generic
# renderer in internal/generator/providers/render.go consumes this file and
# produces identical OutputFile slices for the registered "claude" preset.
#
# Spec schema: schema/provider.schema.json

name = "claude"
display_name = "Claude Code"

# Always-emitted IsDir markers — keep stale-file cleanup scoped correctly.
directories = [".claude", ".claude/skills", ".claude/agents", ".claude/rules"]

# CLAUDE.md is composed by walking these sections in order.
# The skill listing (skills and commands, which Claude Code merges into one list)
# and the Agent tool description carry each item's name and description on every
# request. The combined description text of an entry is cut at 1,536 characters.
[listing]
skills = true
commands = true
agents = true
description_limit = 1536

[root]
file = "CLAUDE.md"
sections = ["header", "title", "description", "rules_inline", "context_inline", "agents_delegation"]

# Skills: .claude/skills/{id}/SKILL.md with frontmatter, the skill body, a
# Resources index, and any rules/context that explicitly target this output.
# `resources = true` also emits the bundled references/ scripts/ assets/ files
# under the skill directory.
[outputs.skills]
mode = "per_item_file"
dir = ".claude/skills"
filename = "{id}/SKILL.md"
resources = true
# Drops skills that [placement] or `placement: plugin` frontmatter ships only
# through a plugin. Without a [placement] block every skill is kept.
filter = "placement_core"

[outputs.skills.body]
sections = ["frontmatter", "content", "resource_index", "targeted_rules", "targeted_context"]

[outputs.skills.frontmatter]
include_extras = true
# A skill-level `paths` (or `globs`) key gates the skill to matching files.
paths = true
# user-invocable is not written by default: Claude Code's default is true, so a
# skill is listed in the / menu. `[claude.skills] hide_from_menu = true` writes
# `user-invocable: false` on skills that do not set the key; an author-set
# user-invocable or disable-model-invocation is always honoured.
hide_key = "user-invocable"
extras_blacklist = ["priority", "targets", "user_invocable", "placement"]

# Agents: .claude/agents/{id}.md with effort + model resolved from the shared
# resolvers, plus tools/skills lists and the standard scalar fields.
[outputs.agents]
mode = "per_item_file"
dir = ".claude/agents"
filename = "{id}.md"

[outputs.agents.body]
sections = ["frontmatter", "content", "targeted_rules", "targeted_context"]

[outputs.agents.frontmatter]
fields = ["description", "permission_mode"]
tools = true
skills = true
emit_effort = true
emit_model = true

# Rules: .claude/rules/{id}.md. With `[rules] mode = "split"` every rule and
# path-scoped context item is a file; in inline mode only
# path-scoped rules are (with a `paths` field, so Claude loads them when it reads
# a matching file) and everything else stays in CLAUDE.md.
[outputs.rules]
mode = "per_item_file"
dir = ".claude/rules"
filename = "{id}.md"
split = true
inline_filter = "path_scoped"
dialect = "claude"

# Commands are rendered as user-invokable skills (Claude exposes slash
# commands through the skills directory). Filter drops commands whose
# Metadata.Targets explicitly excludes claude. `resources = true` carries the
# bundled references/ scripts/ assets/ of a directory-form command
# (commands/{id}/COMMAND.md); a flat commands/{id}.md has no resources to emit.
[outputs.commands]
mode = "per_item_file"
dir = ".claude/skills"
filename = "{id}/SKILL.md"
resources = true
filter = "placement_core"

[outputs.commands.body]
sections = ["frontmatter", "content", "resource_index", "targeted_rules", "targeted_context"]

[outputs.commands.frontmatter]
fields = ["description", "shortcut", "category"]
include_extras = true
extras_blacklist = ["priority", "targets", "shortcut", "category", "user_invocable", "placement"]

[outputs.commands.frontmatter.constants]
"user-invocable" = true

# Model strings flow through verbatim — no per-tier translation needed.
[model]
field = "model"

# Effort is identity-mapped for Claude: the resolved tier (low/medium/high/
# xhigh/max) is emitted as-is. Codex / Opencode / etc. will diverge here.
[effort_map]
style = "string"

[effort_map.values]
low = "low"
medium = "medium"
high = "high"
xhigh = "xhigh"
max = "max"

# Conditional sidecars driven by config presence.
[[sidecars]]
kind = "claude_settings_json"
path = ".claude/settings.json"
global_path = ".claude/settings.json"
# Claude Code reads user-scope MCP servers from ~/.claude.json, not from
# ~/.claude/settings.json: a user-scope run would write mcpServers there and the other
# keys (plugin settings, effort) to global_path.
global_mcp_path = ".claude.json"
emit_when = "has_claude_settings"

[[sidecars]]
kind = "claude_plugins_json"
path = ".claude/plugins.json"
emit_when = "has_plugins"

# User-scope layout (paths relative to the home directory). Claude Code reads
# user-level memory, skills, agents, commands and rules from ~/.claude.
[global]
root_file = ".claude/CLAUDE.md"
skills_dir = ".claude/skills"
agents_dir = ".claude/agents"
commands_dir = ".claude/commands"
rules_dir = ".claude/rules"
# A skill present at both levels: the personal one wins.
skill_precedence = "Claude Code runs the user-level skill (personal over project)"
