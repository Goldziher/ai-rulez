# Project configuration (4.x)
version = "4.0" # config format
name = "toml-full"
description = "Every deprecated feature in one TOML project"
presets = ["claude", "cursor"]

# Keep the header short.
[header]
style = "compact"

[lint]
fail_on = "warning"

# Tolerated finding counts, lowered over time.
[lint.budget]
AR401 = 3
AR101 = 1

[lint.budgets.skill]
max_lines = 400

[[hooks]]
event = "SessionStart"

[[hooks.hooks]]
type = "command"
command = "ai-rulez usage hook --event start"

[[hooks]]
event = "Stop"

[[hooks.hooks]]
type = "command"
command = "ai-rulez usage record --skill demo && ai-rulez report usage .ai-rulez/usage.jsonl"

[[plugins]]
name = "legacy-plugin"
source = "github.com/example/plugin"

[[mcp_servers]]
name = "docs"
transport = "http"
url = "https://docs.example.com/mcp"
