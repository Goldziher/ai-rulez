# Project configuration (YAML, deprecated since 4.x)
schema = "https://github.com/Goldziher/ai-rulez/schema/ai-rules.schema.json"
version = "5.0"
name = "yaml-full"
description = '''
A YAML project
with the usual shapes
'''
presets = ["claude", {name = "custom", type = "markdown", path = "CUSTOM.md"}]
default = "backend"
gitignore = false # the author opted out
# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
agents_md = false

[profiles]
backend = ["backend"]
all = ["backend", "frontend"]

[header]
style = "detailed"
timestamp = true
hashes = "full"

[lint]

[lint.ratchet]
AR401 = 2

[[mcp_servers]]
name = "db"
command = "uvx"
args = ["mcp-server-sqlite==1.0.0", "--db-path", "data.db"]

[mcp_servers.env]
PORT = "8080"
DEBUG = "true"
NAME = "plain"

[[mcp_servers]]
name = "web"
transport = "http"
url = "https://web.example.com/mcp"

[mcp_servers.headers]
Authorization = "Bearer ${TOKEN}"
