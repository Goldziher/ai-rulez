# AI-Rulez Configuration
# Documentation: https://github.com/Goldziher/ai-rulez

version = '4.0'
name = 'fixture'
presets = ['claude']

[permissions]
ask = ['Bash(git push:*)']
deny = ['Bash(curl:*)', 'Bash(rm -rf:*)', 'Read(./.env)', 'Read(.env)']

