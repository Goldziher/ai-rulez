# AI-Rulez Configuration
# Documentation: https://github.com/Goldziher/ai-rulez

version = '4.0'
name = 'fixture'
presets = ['claude', 'copilot']

[[mcp_servers]]
name = 'docs'
transport = 'http'
url = 'https://docs.example.com/mcp'

[[mcp_servers]]
name = 'local-tools'
command = 'npx'
args = ['-y', '@example/tools-mcp']

[mcp_servers.env]
EXAMPLE_API_KEY = '${EXAMPLE_API_KEY}'

