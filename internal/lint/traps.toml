# Harness trap table: files a harness silently ignores. Each row is data, not
# code: a closed predicate vocabulary (see traps.go), provenance (source, an
# anchor quote copied from the vendor page, verified_on) and a fix hint.
# A row must not ship without a quote and a date. docs/harness-traps.md is
# generated from this table (go test checks it for drift).
schema = 1

[[trap]]
code = "AR9C1"
name = "cursor-rule-extension-ignored"
harness = "cursor"
message = "Cursor ignores files in .cursor/rules that are not .mdc"
certainly_inert = true
hint = "Rename it to .mdc and add frontmatter (description, globs, alwaysApply), or move the text to AGENTS.md."
source = "https://cursor.com/docs/rules"
quote = "A plain .md file in .cursor/rules is ignored by the rules system"
verified_on = "2026-10-05"
harness_version = "docs as of verified_on"
[trap.scope]
dir = ".cursor/rules"
kinds = ["generated", "handwritten"]
[trap.predicate]
kind = "ext-not-in"
allowed = [".mdc"]
ignore_names = ["README.md", "RULE.md"]

[[trap]]
code = "AR9C2"
name = "cursor-rule-not-applied"
harness = "cursor"
message = "this Cursor rule has no description, globs or alwaysApply, so it applies only when @-mentioned in chat"
certainly_inert = false
hint = "Set alwaysApply: true, add globs, or add a description so the agent can request it. Ignore this finding if manual-only is intended."
source = "https://cursor.com/docs/rules"
quote = "Included only when you @-mention the rule in chat."
verified_on = "2026-10-05"
harness_version = "docs as of verified_on"
[trap.scope]
dir = ".cursor/rules"
suffix = ".mdc"
kinds = ["handwritten"]
[trap.predicate]
kind = "frontmatter-missing-all"
keys = ["globs", "description"]
unless = ["alwaysApply"]

[[trap]]
code = "AR9C3"
name = "copilot-exclude-agent-invalid"
harness = "copilot"
message = "excludeAgent must be \"code-review\" or \"cloud-agent\""
certainly_inert = false
hint = "The current docs list \"code-review\" and \"cloud-agent\"; the older \"coding-agent\" spelling is still accepted. Any other value is undocumented."
source = "https://docs.github.com/en/copilot/how-tos/configure-custom-instructions/add-repository-instructions"
quote = "Use either \"code-review\" or \"cloud-agent\""
verified_on = "2026-10-05"
harness_version = "docs as of verified_on"
[trap.scope]
dir = ".github/instructions"
suffix = ".instructions.md"
kinds = ["generated", "handwritten"]
[trap.predicate]
kind = "frontmatter-enum"
key = "excludeAgent"
allowed = ["code-review", "cloud-agent", "coding-agent"]

[[trap]]
code = "AR9C4"
name = "copilot-instructions-suffix"
harness = "copilot"
message = "Copilot reads path-specific instructions only from files named *.instructions.md"
certainly_inert = true
hint = "Rename the file to <name>.instructions.md, or move the text to .github/copilot-instructions.md."
source = "https://docs.github.com/en/copilot/how-tos/configure-custom-instructions/add-repository-instructions"
quote = "The file name must end with .instructions.md"
verified_on = "2026-10-05"
harness_version = "docs as of verified_on"
[trap.scope]
dir = ".github/instructions"
kinds = ["generated", "handwritten"]
[trap.predicate]
kind = "name-suffix-required"
suffix = ".instructions.md"
ignore_names = ["README.md"]

# AR9C5, AR9C6: Kiro. The vendor page is the steering page; the table verifies
# the rule, not what Kiro does with a file that breaks it (not inert).
[[trap]]
code = "AR9C5"
name = "kiro-agent-steering-not-loaded"
harness = "kiro"
message = "this Kiro custom agent has no resources, so it does not load the steering files in .kiro/steering"
certainly_inert = false
hint = "Add the steering files to the agent's resources, for example \"resources\": [\"file://.kiro/steering/**/*.md\"]."
source = "https://kiro.dev/docs/steering/"
quote = "steering files are not automatically included. You must explicitly add them to the agent's resources configuration to load steering context."
verified_on = "2026-10-06"
harness_version = "docs as of verified_on"
[trap.scope]
dir = ".kiro/agents"
suffix = ".json"
kinds = ["generated", "handwritten"]
[trap.predicate]
kind = "json-key-required-if"
key = "resources"
when_dir = ".kiro/steering"
when_suffix = ".md"

[[trap]]
code = "AR9C6"
name = "kiro-steering-frontmatter-not-first"
harness = "kiro"
message = "this Kiro steering file has its inclusion frontmatter after a blank line or other text, so Kiro does not read it"
certainly_inert = false
hint = "Make the opening --- the first bytes of the file."
source = "https://kiro.dev/docs/steering/"
quote = "The inclusion configuration must be the first content in the file - no blank lines or content before it."
verified_on = "2026-10-06"
harness_version = "docs as of verified_on"
[trap.scope]
dir = ".kiro/steering"
suffix = ".md"
kinds = ["generated", "handwritten"]
[trap.predicate]
kind = "frontmatter-first"
key = "inclusion"

# AR9C7: Claude Code ignores a frontmatter field it does not recognise, so a
# variant spelling silently does nothing. The canonical lists are the field
# tables of the skills and sub-agents pages on verified_on.
[[trap]]
code = "AR9C7"
name = "claude-frontmatter-key-spelling"
harness = "claude"
message = "Claude Code ignores this skill frontmatter key because it is not spelled exactly as documented"
certainly_inert = true
hint = "Skill field names are lowercase words separated by hyphens (disable-model-invocation, user-invocable, allowed-tools), except when_to_use."
source = "https://code.claude.com/docs/en/skills"
quote = "A field name must match the table exactly, hyphens included: Claude Code ignores a field it doesn't recognize without reporting an error."
verified_on = "2026-10-06"
harness_version = "docs as of verified_on"
[trap.scope]
dir = ".claude/skills"
suffix = "/SKILL.md"
kinds = ["generated", "handwritten"]
[trap.predicate]
kind = "key-misspelt"
canonical = [
  "name",
  "description",
  "when_to_use",
  "argument-hint",
  "arguments",
  "disable-model-invocation",
  "user-invocable",
  "allowed-tools",
  "disallowed-tools",
  "model",
  "effort",
  "context",
  "agent",
  "background",
  "hooks",
  "paths",
  "shell",
  "metadata",
  "license",
  "compatibility",
]

[[trap]]
code = "AR9C7"
name = "claude-frontmatter-key-spelling"
harness = "claude"
message = "Claude Code ignores this subagent frontmatter key because it is not spelled exactly as documented"
certainly_inert = true
hint = "Multi-word subagent field names are camelCase (maxTurns, disallowedTools, permissionMode, mcpServers)."
source = "https://code.claude.com/docs/en/sub-agents"
quote = "Claude Code ignores a field it doesn't recognize without reporting an error."
verified_on = "2026-10-06"
harness_version = "docs as of verified_on"
[trap.scope]
dir = ".claude/agents"
suffix = ".md"
kinds = ["generated", "handwritten"]
[trap.predicate]
kind = "key-misspelt"
canonical = [
  "name",
  "description",
  "tools",
  "disallowedTools",
  "model",
  "permissionMode",
  "maxTurns",
  "skills",
  "mcpServers",
  "hooks",
  "memory",
  "background",
  "omitClaudeMd",
  "effort",
  "isolation",
  "color",
  "initialPrompt",
  "experimental",
]

# AR9C8, AR9C9: size-over rows. The vendor page, quote and date come from the
# limits row named by limit_id (internal/harnesslimits/limits.toml).
[[trap]]
code = "AR9C8"
name = "claude-listing-truncated"
harness = "claude"
message = "description plus when_to_use is past the Claude Code skill listing cap, so the rest is cut off"
certainly_inert = false
hint = "Put the key use case first and keep description and when_to_use together under the cap; move detail into the skill body."
harness_version = "docs as of verified_on"
[trap.scope]
dir = ".claude/skills"
suffix = "/SKILL.md"
kinds = ["generated", "handwritten"]
[trap.predicate]
kind = "size-over"
limit_id = "claude.skill_listing_chars"
measure = "frontmatter-chars"
keys = ["description", "when_to_use"]

[[trap]]
code = "AR9C9"
name = "harness-limit-exceeded"
harness = "codex"
message = "the AGENTS.md files Codex reads for this directory add up to more than project_doc_max_bytes, so the rest is not loaded"
certainly_inert = false
hint = "Shorten the rules, split them into skills, or raise project_doc_max_bytes in Codex and in [codex] of the ai-rulez config."
harness_version = "docs as of verified_on"
[trap.scope]
suffix = "AGENTS.md"
kinds = ["generated", "handwritten"]
[trap.predicate]
kind = "size-over"
limit_id = "codex.agents_md_chain_bytes"
measure = "chain-bytes"

[[trap]]
code = "AR9C9"
name = "harness-limit-exceeded"
harness = "devin"
message = "this Devin rule file is past the per-file limit, so it is truncated"
certainly_inert = false
hint = "Split the rule into several files or move detail into a skill."
harness_version = "docs as of verified_on"
[trap.scope]
dir = ".devin/rules"
suffix = ".md"
kinds = ["generated", "handwritten"]
[trap.predicate]
kind = "size-over"
limit_id = "devin.rule_file_chars"
measure = "file-chars"

[[trap]]
code = "AR9C9"
name = "harness-limit-exceeded"
harness = "antigravity"
message = "this Antigravity rule file is past the per-file limit, so it is truncated"
certainly_inert = false
hint = "Split the rule into several files or shorten it. The harness counts bytes after expanding includes, so a file under the limit on disk can still be cut."
harness_version = "docs as of verified_on"
[trap.scope]
dir = ".agents/rules"
suffix = ".md"
kinds = ["generated", "handwritten"]
[trap.predicate]
kind = "size-over"
limit_id = "antigravity.rule_file_bytes"
measure = "file-bytes"

[[trap]]
code = "AR9C9"
name = "harness-limit-exceeded"
harness = "kilo"
message = "this REVIEW.md is past the Kilo Code Reviews limit, so it is truncated"
certainly_inert = false
hint = "Shorten REVIEW.md; Kilo reads only the root file, from the base branch."
harness_version = "docs as of verified_on"
[trap.scope]
suffix = "REVIEW.md"
root_only = true
kinds = ["generated", "handwritten"]
[trap.predicate]
kind = "size-over"
limit_id = "kilo.review_md_chars"
measure = "file-chars"
