metadata:
  name: "AI-Rulez Enforcement Test"
  version: "1.0.0"
  description: "Test configuration for enforcement system"

# Global enforcement settings
enforcement:
  enabled: true
  level: "warn"
  agent: "claude"
  auto_fix: false
  timeout: "30s"
  max_violations: 10
  review:
    enabled: true
    max_iterations: 2
    feedback_threshold: 70.0
    timeout: "30s"
    require_improvement: true

# Sample rules with enforcement configuration
rules:
  - name: "no-console-log"
    content: "Avoid using console.log in production code. Use proper logging instead."
    enforcement:
      enabled: true
      level: "error"
      auto_fix: true

  - name: "proper-error-handling"
    content: "Always implement proper error handling with try-catch blocks or error return values."
    enforcement:
      enabled: true
      level: "warn"

  - name: "code-comments"
    content: "Add meaningful comments to explain complex logic and business rules."
    enforcement:
      enabled: false  # Disabled for this rule

# Sample sections
sections:
  - name: "coding-standards"
    content: |
      ## Coding Standards

      - Use meaningful variable and function names
      - Follow consistent indentation (2 spaces)
      - Keep functions small and focused
      - Write self-documenting code
    enforcement:
      enabled: true
      level: "warn"

outputs:
  - path: "CLAUDE.md"
    type: "rule"